  <script type="text/babel">
    const { useState, useEffect, useMemo, useRef } = React;

    // --- Currency Math & Formatting (Strict Integer Centavos) ---
    const toCentavos = (val) => {
      if (typeof val === 'string') {
        const cleaned = val.replace(/[₱,\s]/g, '');
        const parsed = parseFloat(cleaned);
        return isNaN(parsed) ? 0 : Math.round(parsed * 100);
      }
      return isNaN(val) ? 0 : Math.round(val * 100);
    };

    const toPesos = (centavos) => (centavos || 0) / 100;

    const formatPeso = (centavos, opts = {}) => {
      const { showSign = false, hideSymbol = false, compact = false } = opts;
      const isNeg = centavos < 0;
      const abs = Math.abs(centavos || 0);
      const pesos = abs / 100;

      let numStr;
      if (compact && abs >= 10000000) {
        numStr = (pesos / 1000).toFixed(1) + 'k';
      } else {
        numStr = pesos.toLocaleString('en-PH', {
          minimumFractionDigits: 2,
          maximumFractionDigits: 2,
        });
      }

      const sym = hideSymbol ? '' : '₱';
      const sign = showSign ? (isNeg ? '-' : '+') : (isNeg ? '-' : '');
      return `${sign}${sym}${numStr}`;
    };

    const formatTxDate = (isoStr) => {
      if (!isoStr) return 'Recent';
      const d = new Date(isoStr);
      if (isNaN(d.getTime())) return 'Recent';
      const now = new Date();
      const isToday = d.toDateString() === now.toDateString();
      const yesterday = new Date(now);
      yesterday.setDate(now.getDate() - 1);
      const isYesterday = d.toDateString() === yesterday.toDateString();

      const timeStr = d.toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit', hour12: true });
      if (isToday) return `Today • ${timeStr}`;
      if (isYesterday) return `Yesterday • ${timeStr}`;

      const sameYear = d.getFullYear() === now.getFullYear();
      const dateStr = d.toLocaleDateString('en-US', {
        month: 'short',
        day: 'numeric',
        year: sameYear ? undefined : 'numeric',
      });
      return `${dateStr} • ${timeStr}`;
    };

    const calculateSplit = (totalCentavos, pct) => {
      if (totalCentavos <= 0 || pct <= 0) return 0;
      return Math.round((totalCentavos * pct) / 100);
    };

    const distributeExact = (totalCentavos, splits) => {
      const res = {};
      let allocatedSum = 0;
      let maxItem = splits[0];

      splits.forEach((s) => {
        const amt = calculateSplit(totalCentavos, s.percentage);
        res[s.bucketId] = amt;
        allocatedSum += amt;
        if (s.percentage > (maxItem?.percentage || 0)) {
          maxItem = s;
        }
      });

      const remainder = totalCentavos - allocatedSum;
      if (remainder !== 0 && maxItem) {
        res[maxItem.bucketId] = (res[maxItem.bucketId] || 0) + remainder;
      }
      return res;
    };

    // --- In-Keypad Math Expression Evaluator (Strict Integer Centavos) ---
    const evaluateMathExpression = (expr) => {
      if (!expr || typeof expr !== 'string') return 0;
      const clean = expr.trim();
      if (!clean) return 0;

      // Tokenize sequence preserving operators + and -
      const tokens = clean.match(/([+\-]?[^+\-]+)/g);
      if (!tokens) return 0;

      let totalCentavos = 0;
      for (const token of tokens) {
        const trimmed = token.trim();
        if (!trimmed || trimmed === '+' || trimmed === '-') continue;
        const isSub = trimmed.startsWith('-');
        const numStr = trimmed.replace(/^[+\-\s]+/, '');
        const centavos = toCentavos(numStr);
        if (isSub) {
          totalCentavos -= centavos;
        } else {
          totalCentavos += centavos;
        }
      }
      return Math.max(0, totalCentavos);
    };

    // --- Synthesized Haptic Audio Feedback (100% Offline Web Audio API) ---
    const playHapticSound = (type = 'click') => {
      try {
        const AudioContextClass = window.AudioContext || window.webkitAudioContext;
        if (!AudioContextClass) return;
        const ctx = new AudioContextClass();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();

        if (type === 'click') {
          osc.type = 'sine';
          osc.frequency.setValueAtTime(700, ctx.currentTime);
          osc.frequency.exponentialRampToValueAtTime(350, ctx.currentTime + 0.025);
          gain.gain.setValueAtTime(0.04, ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.025);
          osc.start();
          osc.stop(ctx.currentTime + 0.03);
          osc.connect(gain);
          gain.connect(ctx.destination);
        } else if (type === 'success') {
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(520, ctx.currentTime);
          osc.frequency.exponentialRampToValueAtTime(780, ctx.currentTime + 0.08);
          gain.gain.setValueAtTime(0.06, ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.09);
          osc.start();
          osc.stop(ctx.currentTime + 0.1);
          osc.connect(gain);
          gain.connect(ctx.destination);
        } else if (type === 'chime') {
          // 4-note ascending major arpeggio: C5 (523Hz), E5 (659Hz), G5 (784Hz), C6 (1046Hz)
          const notes = [523.25, 659.25, 783.99, 1046.50];
          notes.forEach((freq, idx) => {
            const noteOsc = ctx.createOscillator();
            const noteGain = ctx.createGain();
            noteOsc.type = 'sine';
            const startTime = ctx.currentTime + idx * 0.08;
            noteOsc.frequency.setValueAtTime(freq, startTime);
            noteGain.gain.setValueAtTime(0.07, startTime);
            noteGain.gain.exponentialRampToValueAtTime(0.001, startTime + 0.22);
            noteOsc.connect(noteGain);
            noteGain.connect(ctx.destination);
            noteOsc.start(startTime);
            noteOsc.stop(startTime + 0.25);
          });
        } else if (type === 'coin') {
          // Metallic two-tone coin ping: 987Hz (B5) -> 1318Hz (E6)
          const ping1 = ctx.createOscillator();
          const ping2 = ctx.createOscillator();
          const coinGain = ctx.createGain();
          ping1.type = 'sine';
          ping2.type = 'sine';
          ping1.frequency.setValueAtTime(987.77, ctx.currentTime);
          ping2.frequency.setValueAtTime(1318.51, ctx.currentTime + 0.05);
          coinGain.gain.setValueAtTime(0.08, ctx.currentTime);
          coinGain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.32);
          ping1.connect(coinGain);
          ping2.connect(coinGain);
          coinGain.connect(ctx.destination);
          ping1.start(ctx.currentTime);
          ping1.stop(ctx.currentTime + 0.12);
          ping2.start(ctx.currentTime + 0.05);
          ping2.stop(ctx.currentTime + 0.32);
        }
      } catch (e) {
        // Silently ignore if audio context isn't supported
      }
    };

    // --- 100% Offline Lightweight Canvas Confetti Burst ---
    const triggerCanvasConfetti = () => {
      try {
        let canvas = document.getElementById('centavo-confetti-canvas');
        if (!canvas) {
          canvas = document.createElement('canvas');
          canvas.id = 'centavo-confetti-canvas';
          canvas.style.position = 'fixed';
          canvas.style.inset = '0';
          canvas.style.width = '100vw';
          canvas.style.height = '100vh';
          canvas.style.pointerEvents = 'none';
          canvas.style.zIndex = '99999';
          document.body.appendChild(canvas);
        }
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
        const ctx = canvas.getContext('2d');
        if (!ctx) return;

        // Palette: Emerald, Light Emerald, Paper Gold, Mint, Crisp White
        const colors = ['#1F6E58', '#2ABF9E', '#EAB308', '#E8F3EE', '#FFFFFF', '#F59E0B', '#144F3F'];
        const particles = [];
        const count = 80;
        for (let i = 0; i < count; i++) {
          particles.push({
            x: canvas.width / 2 + (Math.random() - 0.5) * 180,
            y: canvas.height * 0.45 + (Math.random() - 0.5) * 90,
            vx: (Math.random() - 0.5) * 14,
            vy: (Math.random() - 0.75) * 16 - 3,
            size: Math.random() * 8 + 5,
            color: colors[Math.floor(Math.random() * colors.length)],
            rotation: Math.random() * 360,
            vRot: (Math.random() - 0.5) * 14,
            opacity: 1,
          });
        }

        const startTime = Date.now();
        const render = () => {
          const elapsed = Date.now() - startTime;
          ctx.clearRect(0, 0, canvas.width, canvas.height);
          particles.forEach((p) => {
            p.x += p.vx;
            p.y += p.vy;
            p.vy += 0.42; // gravity
            p.rotation += p.vRot;
            p.opacity = Math.max(0, 1 - elapsed / 2300);

            ctx.save();
            ctx.globalAlpha = p.opacity;
            ctx.translate(p.x, p.y);
            ctx.rotate((p.rotation * Math.PI) / 180);
            ctx.fillStyle = p.color;
            ctx.fillRect(-p.size / 2, -p.size / 2, p.size, p.size * 0.7);
            ctx.restore();
          });

          if (elapsed < 2400) {
            requestAnimationFrame(render);
          } else {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
          }
        };
        render();
      } catch (e) {
        console.warn('Canvas confetti error', e);
      }
    };

    // --- CSV Portability Helper (Offline CSV Generation) ---
    const exportToCSV = (transactions, buckets, wallets) => {
      const headers = ['Date', 'Type', 'Amount (PHP)', 'Envelope', 'Wallet', 'Note'];
      const rows = transactions.map((t) => {
        const b = buckets.find((item) => item.id === t.bucketId)?.name || 'N/A';
        const w = wallets.find((item) => item.id === t.walletId)?.name || 'N/A';
        const dateStr = new Date(t.timestamp).toLocaleDateString('en-PH');
        const pesos = (t.amountCentavos / 100).toFixed(2);
        const signedPesos = t.type === 'expense' ? `-${pesos}` : pesos;
        return [
          `"${dateStr}"`,
          `"${t.type}"`,
          `"${signedPesos}"`,
          `"${b.replace(/"/g, '""')}"`,
          `"${w.replace(/"/g, '""')}"`,
          `"${(t.note || '').replace(/"/g, '""')}"`,
        ].join(',');
      });

      const csvContent = [headers.join(','), ...rows].join('\r\n');
      const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `centavo-ledger-${new Date().toISOString().slice(0, 10)}.csv`;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
    };

    // --- Philippine Seed Data (v3 with Savings Goals) ---
    const INITIAL_STATE = {
      version: 3,
      isPrivacyMode: false,
      streakDays: 3,
      unallocatedCentavos: 0, // Funds ready to be allocated into envelopes at user's pace
      paydaySchedule: '15_30', // '15_30' (15th & 30th) | 'end_of_month' | '15'
      wallets: [
        {
          id: 'wallet-cash',
          name: 'Cash on Hand',

          icon: 'cash',

        },
        {

          balanceCentavos: 1250000, // ₱12,500.00
          icon: 'gcash',
          updatedAt: new Date().toISOString(),
        },
        {
          id: 'wallet-maya',
          name: 'Maya Wallet',
          type: 'ewallet',
          balanceCentavos: 520000, // ₱5,200.00
          icon: 'maya',
          updatedAt: new Date().toISOString(),
        },
      ],
      buckets: [
        {
          id: 'bucket-food',
          name: 'Food & Groceries',
          category: 'needs',
          icon: 'utensils',
          allocatedCentavos: 600000, // ₱6,000.00
          spentCentavos: 245000,     // ₱2,450.00 (Remaining: ₱3,550.00)
          isDiscretionary: true,
          order: 1,
        },
        {
          id: 'bucket-transport',
          name: 'Transport & Commute',
          category: 'needs',
          icon: 'car',
          allocatedCentavos: 250000, // ₱2,500.00
          spentCentavos: 88000,      // ₱880.00 (Remaining: ₱1,620.00)
          isDiscretionary: false,
          order: 2,
        },
        {
          id: 'bucket-bills',
          name: 'Bills & Load',
          category: 'needs',
          icon: 'receipt',
          allocatedCentavos: 400000, // ₱4,000.00
          spentCentavos: 329900,     // ₱3,299.00 (Remaining: ₱701.00)
          isDiscretionary: false,
          order: 3,

    // --- "No-Spend Day" Habit Heatmap & Calendar Tracker ---
    function NoSpendHeatmapCard({ transactions, buckets, streakDays, triggerAudio, theme }) {
      const [selectedDayInfo, setSelectedDayInfo] = useState(null);

      const heatmapData = useMemo(() => {
        const now = new Date();
        const year = now.getFullYear();
        const month = now.getMonth();
        const totalDays = new Date(year, month + 1, 0).getDate();
        const todayNum = now.getDate();
        const monthName = now.toLocaleDateString('en-US', { month: 'long' });

        // First day of month (Monday = 0 ... Sunday = 6)
        const firstDayWeekday = (new Date(year, month, 1).getDay() + 6) % 7;

        let noSpendCount = 0;
        const days = [];

        for (let d = 1; d <= totalDays; d++) {
          const dayStr = `${year}-${String(month + 1).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
          const isPastOrToday = d <= todayNum;
          const isToday = d === todayNum;

          // Discretionary spend on this day
          const dayTxs = (transactions || []).filter((t) => t.timestamp && t.timestamp.startsWith(dayStr) && t.type === 'expense');
          const discretionarySpent = dayTxs.reduce((sum, tx) => {
            const b = (buckets || []).find((bucket) => bucket.id === tx.bucketId);
            return sum + (b && b.isDiscretionary ? tx.amountCentavos : 0);
          }, 0);

          const isNoSpend = isPastOrToday && discretionarySpent === 0;
          if (isNoSpend) noSpendCount++;

          days.push({
            day: d,
            dayStr,
            isPastOrToday,
            isToday,
            isNoSpend,
            spentCentavos: discretionarySpent,
            txCount: dayTxs.length,
          });
        }

        return {
          year,
          monthName,
          totalDays,
          todayNum,
          firstDayWeekday,
          days,
          noSpendCount,
          daysElapsed: todayNum,
        };
      }, [transactions, buckets]);

      const DOW = ['M', 'T', 'W', 'T', 'F', 'S', 'S'];

      return (
        <div className="bg-white dark:bg-[#18201C] rounded-2xl border border-[#E7EAE5] dark:border-[#27342D] p-4 md:p-5 shadow-2xs space-y-3">

                  No-Spend Days

                <span className="text-[10px] font-bold px-2 py-0.5 rounded-full bg-[#E8F3EE] dark:bg-[#153228] text-[#1F6E58] dark:text-[#2ABF9E]">
                  {heatmapData.noSpendCount} / {heatmapData.daysElapsed} days
                </span>
              </div>
            </div>

            <div className="flex items-center space-x-2 self-start sm:self-auto">
              <span className="text-xs font-bold text-[#1F6E58] dark:text-[#2ABF9E] flex items-center gap-1.5 bg-[#E8F3EE] dark:bg-[#153228] px-2.5 py-1 rounded-xl">
                <IconLiveFlame className="w-3.5 h-3.5" />
                <span>{streakDays || 3}-Day Streak</span>
              </span>
            </div>
          </div>

          {/* DOW headers */}
          <div className="grid grid-cols-7 gap-1 sm:gap-1.5 text-center text-[10px] font-bold text-[#647067] dark:text-[#8E9E94] pt-1">
            {DOW.map((d, i) => (
              <span key={i}>{d}</span>
            ))}
          </div>

          {/* 7-column Calendar Heatmap Grid */}
          <div className="grid grid-cols-7 gap-1 sm:gap-1.5">
            {/* Blank offset tiles for Monday-start */}
            {Array.from({ length: heatmapData.firstDayWeekday }).map((_, i) => (
              <div key={`empty-${i}`} className="aspect-square opacity-0 pointer-events-none" />
            ))}

            {/* Day tiles */}
            {heatmapData.days.map((item) => {
              const isSelected = selectedDayInfo?.day === item.day;
              return (
                <button
                  key={item.day}
                  type="button"
                  onClick={() => {
                    triggerAudio('click');
                    setSelectedDayInfo(item);
                  }}
                  className={`aspect-square rounded-lg flex flex-col items-center justify-center text-[10px] sm:text-xs font-bold transition-all active:scale-90 relative ${!item.isPastOrToday
                    ? 'bg-[#F8F9F7] dark:bg-[#111815] text-[#C9D0CB] dark:text-[#3D4E44] border border-[#E7EAE5] dark:border-[#27342D]/60'
                    : item.isNoSpend
                      ? 'bg-[#E6F2EE] dark:bg-[#153228] text-[#1F6E58] dark:text-[#2ABF9E] shadow-2xs hover:brightness-95'
                      : item.spentCentavos > 0

                  title={`${heatmapData.monthName} ${item.day}: ${!item.isPastOrToday

              <span className="flex items-center gap-1">
                <span className="w-2.5 h-2.5 rounded-sm bg-[#F8F9F7] dark:bg-[#111815] border border-[#E7EAE5] dark:border-[#27342D] inline-block" />
                <span>Upcoming</span>
              </span>
            </div>

            <div>
              {selectedDayInfo ? (
                <span className="font-semibold text-[#181C19] dark:text-[#F1F5F3]">
                  {heatmapData.monthName} {selectedDayInfo.day}:{' '}
                  {selectedDayInfo.isNoSpend ? (
                    <span className="text-[#1F6E58] dark:text-[#2ABF9E] font-bold">₱0.00 (Saved!)</span>

    // --- Envelope "Cover & Borrow" (1-Tap Rebalancing Modal) ---
    function RebalanceDeficitModal({ targetBucketId, buckets, onClose, onConfirm, triggerAudio }) {
      const targetBucket = buckets.find((b) => b.id === targetBucketId);
      const remTarget = targetBucket ? targetBucket.allocatedCentavos - targetBucket.spentCentavos : 0;
      const deficitCentavos = Math.abs(Math.min(0, remTarget));

      // Candidate donor envelopes with positive surplus balance
      const donorCandidates = useMemo(() => {
        return buckets.filter((b) => {
          if (b.id === targetBucketId) return false;
          const rem = b.allocatedCentavos - b.spentCentavos;
          return rem > 0;
        });
      }, [buckets, targetBucketId]);

      const [selectedDonorId, setSelectedDonorId] = useState(donorCandidates[0]?.id || '');
      const selectedDonor = buckets.find((b) => b.id === selectedDonorId);
      const donorSurplus = selectedDonor ? Math.max(0, selectedDonor.allocatedCentavos - selectedDonor.spentCentavos) : 0;

      const coverAmountCentavos = Math.min(deficitCentavos, donorSurplus);
      const isValid = selectedDonorId && coverAmountCentavos > 0;

      const handleConfirm = () => {
        if (!isValid) return;
        triggerAudio('click');
        onConfirm(targetBucketId, selectedDonorId, coverAmountCentavos);
        onClose();
      };

      if (!targetBucket) return null;

      return (
        <div className="fixed inset-0 z-50 flex items-end sm:items-center justify-center bg-black/60 backdrop-blur-xs p-0 sm:p-4 animate-in fade-in duration-150">
          <div className="fixed inset-0" onClick={onClose} />
          <div className="relative w-full max-w-md bg-white dark:bg-[#18201C] rounded-t-3xl sm:rounded-2xl shadow-2xl border border-[#E7EAE5] dark:border-[#27342D] p-5 z-10 animate-in slide-in-from-bottom duration-200">

                </span>
                <div>
                  <h3 className="text-sm font-bold text-[#181C19] dark:text-[#F1F5F3]">
                    Cover & Borrow Rebalance
                  </h3>
                  <p className="text-[11px] text-[#647067] dark:text-[#8E9E94]">
                    Rebalance envelope deficits from available surplus
                  </p>
                </div>
              </div>
              <button

                className="text-xs font-bold text-[#647067] dark:text-[#8E9E94] hover:text-[#181C19] p-1"

                ✕
              </button>
            </div>

            {/* Overspent Target Alert Card */}

              <div>
                <span className="text-[10px] font-bold uppercase tracking-wider text-[#DC2626] block">
                  Overspent Envelope
                </span>
                <span className="text-sm font-bold text-[#181C19] dark:text-[#F1F5F3]">
                  {targetBucket.name}
                </span>
              </div>
              <div className="text-right">
                <span className="text-[10px] text-[#DC2626] block font-semibold">Deficit</span>
                <span className="text-sm font-extrabold text-[#DC2626]">
                  {formatPeso(deficitCentavos)}
                </span>
              </div>
            </div>

            {/* Donor Envelope Selector */}

              <label className="text-[11px] font-bold uppercase text-[#647067] dark:text-[#8E9E94] block mb-1.5">

                      <div
                        key={b.id}

                          triggerAudio('click');

                          ? 'bg-[#E8F3EE] dark:bg-[#153228] border-[#1F6E58] dark:border-[#2ABF9E] text-[#1F6E58] dark:text-[#2ABF9E] shadow-2xs'

          </div>
        </div>
      );
    }

    // --- Enhanced Interactive Analytics & Financial Insights Component ---
    function AnalyticsView({ state, dailyPaceCentavos, isDark, isPink, triggerAudio, formatPeso }) {
      // 1. Timeframe Filter for Daily Velocity Bar Chart
      const [velocityFilter, setVelocityFilter] = useState('7d'); // '7d' | '14d' | 'month'
      const [selectedDayIndex, setSelectedDayIndex] = useState(null);

      // 2. Category Filter for Envelope Donut & Breakdown
      const [categoryFilter, setCategoryFilter] = useState('all'); // 'all' | 'needs' | 'wants' | 'savings'

      // 3. Wallet Filter for Cash Flow In vs Out
      const [cashflowWalletFilter, setCashflowWalletFilter] = useState('all'); // 'all' | walletId

      // 4. Rhythm Filter (All vs Wants Only)
      const [rhythmFilter, setRhythmFilter] = useState('all'); // 'all' | 'wants'

      // 5. 50/30/20 Rule Mode (Actual vs Target)
      const [ruleMode, setRuleMode] = useState('actual'); // 'actual' | 'target'

      // --- Compute Daily Velocity Bar Chart Data ---
      const dailyVelocityData = useMemo(() => {
        const daysCount = velocityFilter === '7d' ? 7 : velocityFilter === '14d' ? 14 : 30;
        const today = new Date();
        const result = [];
        for (let i = daysCount - 1; i >= 0; i--) {
          const d = new Date(today.getFullYear(), today.getMonth(), today.getDate() - i);
          const dateStr = d.toISOString().slice(0, 10);
          const dayTxs = state.transactions.filter(
            (t) => t.type === 'expense' && (t.timestamp || '').slice(0, 10) === dateStr
          );
          const spent = dayTxs.reduce((sum, t) => sum + (t.amountCentavos || 0), 0);
          const dayName = d.toLocaleDateString('en-PH', { weekday: 'short' });
          const dayNum = d.getDate();
          const isWeekend = d.getDay() === 0 || d.getDay() === 6;
          result.push({
            dateStr,
            label: `${dayName} ${dayNum}`,
            shortLabel: dayName.slice(0, 1),
            dayNum,
            isWeekend,
            spentCentavos: spent,
            isGreen: spent <= dailyPaceCentavos,
          });
        }
        return result;
      }, [state.transactions, velocityFilter, dailyPaceCentavos]);

      const maxDaySpent = Math.max(...dailyVelocityData.map((d) => d.spentCentavos), dailyPaceCentavos, 1);
      const totalPeriodSpent = dailyVelocityData.reduce((sum, d) => sum + d.spentCentavos, 0);
      const avgDailySpent = Math.round(totalPeriodSpent / (dailyVelocityData.length || 1));
      const greenDaysCount = dailyVelocityData.filter((d) => d.isGreen).length;
      const peakDay = dailyVelocityData.reduce((max, d) => (d.spentCentavos > max.spentCentavos ? d : max), dailyVelocityData[0]);
      const activeSelectedDay = selectedDayIndex !== null ? dailyVelocityData[selectedDayIndex] : dailyVelocityData[dailyVelocityData.length - 1];

      // --- Compute Cash Flow In vs Out Data ---
      const cashflowData = useMemo(() => {
        let txs = state.transactions;
        if (cashflowWalletFilter !== 'all') {
          txs = txs.filter((t) => t.walletId === cashflowWalletFilter);
        }
        const income = txs.filter((t) => t.type === 'income' || t.type === 'deposit').reduce((sum, t) => sum + (t.amountCentavos || 0), 0);
        const expense = txs.filter((t) => t.type === 'expense').reduce((sum, t) => sum + (t.amountCentavos || 0), 0);
        const netSaved = Math.max(0, income - expense);
        const retentionRate = income > 0 ? Math.round((netSaved / income) * 100) : 0;
        return { income, expense, netSaved, retentionRate };
      }, [state.transactions, cashflowWalletFilter]);

      // --- Compute Envelope Donut & Category Filter Data ---
      const filteredBuckets = useMemo(() => {
        if (categoryFilter === 'all') return state.buckets;
        return state.buckets.filter((b) => b.category === categoryFilter);
      }, [state.buckets, categoryFilter]);

      const filteredTotalSpent = useMemo(() => {
        return filteredBuckets.reduce((sum, b) => sum + b.spentCentavos, 0);
      }, [filteredBuckets]);

      const donutSegments = useMemo(() => {
        const total = filteredTotalSpent || 1;
        const palette = isPink
          ? ['#F43F5E', '#FB7185', '#F472B6', '#E11D48', '#FDA4AF', '#BE123C', '#E879F9']
          : ['#1F6E58', '#2ABF9E', '#3B82F6', '#F59E0B', '#EF4444', '#8B5CF6', '#10B981'];
        let accum = 0;
        return filteredBuckets.filter((b) => b.spentCentavos > 0).map((b, idx) => {
          const pct = (b.spentCentavos / total) * 100;
          const startPct = accum;
          accum += pct;
          return { ...b, pct, startPct, color: palette[idx % palette.length] };
        });
      }, [filteredBuckets, filteredTotalSpent, isPink]);

      // --- Compute Weekend vs Weekday Spending Rhythm ---
      const rhythmData = useMemo(() => {
        const txs = state.transactions.filter((t) => {
          if (t.type !== 'expense') return false;
          if (rhythmFilter === 'wants') {
            const bucket = state.buckets.find((b) => b.id === t.bucketId);
            return bucket && bucket.category === 'wants';
          }
          return true;
        });

        let weekdayTotal = 0, weekdayCount = 0;
        let weekendTotal = 0, weekendCount = 0;

        txs.forEach((t) => {
          const d = new Date(t.timestamp || Date.now());
          const day = d.getDay(); // 0: Sun, 5: Fri, 6: Sat
          if (day === 0 || day === 5 || day === 6) {
            weekendTotal += t.amountCentavos;
            weekendCount++;
          } else {
            weekdayTotal += t.amountCentavos;
            weekdayCount++;
          }
        });

        const weekdayAvg = weekdayCount > 0 ? Math.round(weekdayTotal / weekdayCount) : 0;
        const weekendAvg = weekendCount > 0 ? Math.round(weekendTotal / weekendCount) : 0;
        const multiplier = weekdayAvg > 0 ? (weekendAvg / weekdayAvg).toFixed(1) : '1.0';

        return { weekdayTotal, weekendTotal, weekdayAvg, weekendAvg, multiplier };
      }, [state.transactions, state.buckets, rhythmFilter]);

      // --- Compute Custom Budget Allocation vs Actual Spend ---
      const complianceData = useMemo(() => {
        const totalSpent = state.buckets.reduce((sum, b) => sum + b.spentCentavos, 0) || 1;
        const needsSpent = state.buckets.filter((b) => b.category === 'needs').reduce((sum, b) => sum + b.spentCentavos, 0);
        const wantsSpent = state.buckets.filter((b) => b.category === 'wants').reduce((sum, b) => sum + b.spentCentavos, 0);
        const savingsSpent = state.buckets.filter((b) => b.category === 'savings').reduce((sum, b) => sum + b.spentCentavos, 0);

        const needsPct = Math.round((needsSpent / totalSpent) * 100);
        const wantsPct = Math.round((wantsSpent / totalSpent) * 100);
        const savingsPct = Math.max(0, 100 - needsPct - wantsPct);

        // Custom Planned Allocation Targets from the user's active envelopes
        const totalAllocated = state.buckets.reduce((sum, b) => sum + b.allocatedCentavos, 0) || 1;
        const needsAlloc = state.buckets.filter((b) => b.category === 'needs').reduce((sum, b) => sum + b.allocatedCentavos, 0);
        const wantsAlloc = state.buckets.filter((b) => b.category === 'wants').reduce((sum, b) => sum + b.allocatedCentavos, 0);
        const savingsAlloc = state.buckets.filter((b) => b.category === 'savings').reduce((sum, b) => sum + b.allocatedCentavos, 0);

        const needsAllocPct = Math.round((needsAlloc / totalAllocated) * 100);
        const wantsAllocPct = Math.round((wantsAlloc / totalAllocated) * 100);
        const savingsAllocPct = Math.max(0, 100 - needsAllocPct - wantsAllocPct);

        return {
          totalSpent,
          needsSpent,
          wantsSpent,
          savingsSpent,
          needsPct,
          wantsPct,
          savingsPct,
          totalAllocated,
          needsAlloc,
          wantsAlloc,
          savingsAlloc,
          needsAllocPct,
          wantsAllocPct,
          savingsAllocPct,
        };
      }, [state.buckets]);

      // Chart coordinates for Bar Chart
      const chartWidth = 320;
      const chartHeight = 120;
      const numBars = dailyVelocityData.length;
      const slotWidth = chartWidth / numBars;
      const barWidth = Math.max(4, slotWidth * 0.6);
      const paceY = Math.max(10, Math.min(chartHeight - 10, chartHeight - (dailyPaceCentavos / maxDaySpent) * (chartHeight - 20)));

      return (
        <div className="space-y-5 animate-in fade-in duration-200">
          {/* Header & Live Status */}
          <div className="px-1 flex items-center justify-between">
            <div>
              <h2 className="text-sm md:text-base font-bold text-[#181C19] dark:text-[#F1F5F3]">
                Spending Analytics &amp; Health
              </h2>
              <p className="text-xs text-[#647067] dark:text-[#8E9E94]">
                Interactive insights with multi-dimensional filtering
              </p>
            </div>
            <span className="text-xs font-bold px-2.5 py-1 rounded-full bg-[#E8F3EE] dark:bg-[#153228] text-[#1F6E58] dark:text-[#2ABF9E] flex items-center gap-1 shadow-2xs">
              <span className="w-1.5 h-1.5 rounded-full bg-[#1F6E58] dark:bg-[#2ABF9E] animate-pulse" />
              <span>Live Vault</span>
            </span>
          </div>

          {/* Top 3 KPI Insight Metric Badges */}
          <div className="grid grid-cols-3 gap-2 sm:gap-3">
            <div className="p-3 rounded-2xl bg-white dark:bg-[#18201C] border border-[#E7EAE5] dark:border-[#27342D] shadow-2xs">
              <span className="text-[10px] font-bold uppercase tracking-wider text-[#647067] dark:text-[#8E9E94] block">
                Daily Allowance
              </span>
              <div className="text-sm sm:text-base font-black text-[#1F6E58] dark:text-[#2ABF9E] num-font mt-0.5">
                {formatPeso(dailyPaceCentavos)}
              </div>
              <span className="text-[9px] text-[#647067] dark:text-[#8E9E94]">Safe pace / day</span>
            </div>

            <div className="p-3 rounded-2xl bg-white dark:bg-[#18201C] border border-[#E7EAE5] dark:border-[#27342D] shadow-2xs">
              <span className="text-[10px] font-bold uppercase tracking-wider text-[#647067] dark:text-[#8E9E94] block">
                Savings Kept
              </span>
              <div className="text-sm sm:text-base font-black text-[#15803D] dark:text-[#34D399] num-font mt-0.5">
                {cashflowData.retentionRate}%
              </div>
              <span className="text-[9px] text-[#647067] dark:text-[#8E9E94]">Retained this cycle</span>
            </div>

            <div className="p-3 rounded-2xl bg-white dark:bg-[#18201C] border border-[#E7EAE5] dark:border-[#27342D] shadow-2xs">
              <span className="text-[10px] font-bold uppercase tracking-wider text-[#647067] dark:text-[#8E9E94] block">
                Weekend Surge
              </span>
              <div className="text-sm sm:text-base font-black text-amber-500 num-font mt-0.5">
                {rhythmData.multiplier}x
              </div>
              <span className="text-[9px] text-[#647067] dark:text-[#8E9E94]">vs weekday average</span>
            </div>
          </div>

          {/* CHART 1: Interactive Daily Spend Velocity & Pace (With Timeframe Filter) */}
          <div className="bg-white dark:bg-[#18201C] rounded-2xl border border-[#E7EAE5] dark:border-[#27342D] p-5 shadow-2xs space-y-4">
            <div className="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-2 pb-1 border-b border-[#E7EAE5]/60 dark:border-[#27342D]/60">
              <div>
                <h3 className="text-xs font-bold uppercase tracking-wider text-[#181C19] dark:text-[#F1F5F3] flex items-center gap-1.5">
                  <IconClock className="w-4 h-4 text-[#1F6E58] dark:text-[#2ABF9E]" />
                  <span>Daily Spending Velocity</span>
                </h3>
                <p className="text-[11px] text-[#647067] dark:text-[#8E9E94]">
                  Tap any bar to inspect spend vs your daily safe pace
                </p>
              </div>

              {/* Filter Pills: 7d | 14d | 30d */}
              <div className="flex items-center space-x-1 p-1 bg-stone-100 dark:bg-[#121815] rounded-xl border border-[#E7EAE5] dark:border-[#27342D] self-start sm:self-auto">
                {[
                  { id: '7d', label: '7 Days' },
                  { id: '14d', label: '14 Days' },
                  { id: 'month', label: '30 Days' },
                ].map((f) => (
                  <button
                    key={f.id}
                    type="button"
                    onClick={() => {
                      triggerAudio('click');
                      setVelocityFilter(f.id);
                      setSelectedDayIndex(null);
                    }}
                    className={`px-2.5 py-1 rounded-lg text-[11px] font-bold transition-all ${velocityFilter === f.id
                      ? 'bg-white dark:bg-[#1F6E58] text-[#1F6E58] dark:text-white shadow-2xs'
                      : 'text-[#647067] dark:text-[#8E9E94] hover:text-[#181C19]'
                      }`}
                  >
                    {f.label}
                  </button>
                ))}
              </div>
            </div>

            {/* SVG Interactive Bar Chart */}
            <div className="relative pt-2">
              <svg viewBox={`0 0 ${chartWidth} ${chartHeight}`} className="w-full h-36 overflow-visible select-none">
                {/* Horizontal Safe Pace Benchmark Line */}
                <line
                  x1="0"
                  y1={paceY}
                  x2={chartWidth}
                  y2={paceY}
                  stroke={isDark ? '#2ABF9E' : '#1F6E58'}
                  strokeWidth="1.5"
                  strokeDasharray="4 4"
                  opacity="0.8"
                />
                <text
                  x={chartWidth - 2}
                  y={paceY - 4}
                  textAnchor="end"
                  fontSize="8"
                  fontWeight="bold"
                  fill={isDark ? '#2ABF9E' : '#1F6E58'}
                >
                  Safe Pace ({formatPeso(dailyPaceCentavos, { compact: true })})
                </text>

                {/* Bars */}
                {dailyVelocityData.map((d, idx) => {
                  const x = idx * slotWidth + (slotWidth - barWidth) / 2;
                  const barH = Math.max(3, (d.spentCentavos / maxDaySpent) * (chartHeight - 24));
                  const y = chartHeight - barH;
                  const isSelected = selectedDayIndex === idx;
                  const isCurrent = idx === dailyVelocityData.length - 1;

                  return (
                    <g
                      key={d.dateStr}
                      onClick={() => {
                        triggerAudio('click');
                        setSelectedDayIndex(idx);
                      }}
                      className="cursor-pointer group"
                    >
                      {/* Interactive Tap Zone */}
                      <rect
                        x={idx * slotWidth}
                        y={0}
                        width={slotWidth}
                        height={chartHeight}
                        fill="transparent"
                      />
                      {/* Visual Bar */}
                      <rect
                        x={x}
                        y={y}
                        width={barWidth}
                        height={barH}
                        rx={barWidth > 6 ? 3 : 1.5}
                        fill={
                          isSelected
                            ? isPink ? '#F43F5E' : '#1F6E58'
                            : d.isGreen
                              ? isDark ? '#2ABF9E' : '#28886F'
                              : '#F59E0B'
                        }
                        className="transition-all duration-300"
                        opacity={isSelected ? 1 : isCurrent ? 0.95 : 0.75}
                      />
                      {/* Day Label on X Axis */}
                      {(numBars <= 14 || idx % 5 === 0 || idx === numBars - 1) && (
                        <text
                          x={x + barWidth / 2}
                          y={chartHeight + 11}
                          textAnchor="middle"
                          fontSize="8"
                          fontWeight={isSelected ? 'bold' : 'normal'}
                          fill={isSelected ? (isDark ? '#2ABF9E' : '#1F6E58') : (isDark ? '#8E9E94' : '#647067')}
                        >
                          {numBars <= 7 ? d.label.split(' ')[0] : d.dayNum}
                        </text>
                      )}
                    </g>
                  );
                })}
              </svg>
            </div>

            {/* Interactive Day Inspection Chip */}
            {activeSelectedDay && (
              <div className="p-3 rounded-xl bg-[#F8F9F7] dark:bg-[#121815] border border-[#E7EAE5] dark:border-[#27342D] flex items-center justify-between text-xs transition-all">
                <div className="flex items-center space-x-2">
                  <span className={`w-2.5 h-2.5 rounded-full ${activeSelectedDay.isGreen ? 'bg-[#15803D]' : 'bg-amber-500'}`} />
                  <div>
                    <span className="font-bold text-[#181C19] dark:text-[#F1F5F3]">
                      {activeSelectedDay.label}
                    </span>
                    <span className="text-[11px] text-[#647067] dark:text-[#8E9E94] ml-1.5">
                      {activeSelectedDay.isWeekend ? '(Weekend)' : '(Weekday)'}
                    </span>
                  </div>
                </div>
                <div className="text-right">
                  <div className="font-extrabold text-[#181C19] dark:text-[#F1F5F3] num-font">
                    {formatPeso(activeSelectedDay.spentCentavos)}
                  </div>
                  <div className={`text-[10px] font-semibold ${activeSelectedDay.isGreen ? 'text-[#15803D] dark:text-[#34D399]' : 'text-amber-600 dark:text-amber-400'}`}>
                    {activeSelectedDay.isGreen
                      ? `✓ ${formatPeso(dailyPaceCentavos - activeSelectedDay.spentCentavos)} under pace`
                      : `⚠ ${formatPeso(activeSelectedDay.spentCentavos - dailyPaceCentavos)} over pace`}
                  </div>
                </div>
              </div>
            )}

            {/* Summary Insights */}
            <div className="grid grid-cols-3 gap-2 text-center pt-1 border-t border-[#E7EAE5]/60 dark:border-[#27342D]/60 text-[11px]">
              <div>
                <span className="text-[#647067] dark:text-[#8E9E94]">Avg Spend / Day</span>
                <div className="font-bold text-[#181C19] dark:text-[#F1F5F3] mt-0.5">{formatPeso(avgDailySpent)}</div>
              </div>
              <div>
                <span className="text-[#647067] dark:text-[#8E9E94]">Peak Spend Day</span>
                <div className="font-bold text-[#181C19] dark:text-[#F1F5F3] mt-0.5">{formatPeso(peakDay?.spentCentavos || 0)}</div>
              </div>
              <div>
                <span className="text-[#647067] dark:text-[#8E9E94]">Green Days Rate</span>
                <div className="font-bold text-[#15803D] dark:text-[#34D399] mt-0.5">
                  {Math.round((greenDaysCount / (dailyVelocityData.length || 1)) * 100)}% ({greenDaysCount}/{dailyVelocityData.length}d)
                </div>
              </div>
            </div>
          </div>

          {/* Multi-Column Grid on Tablet/Desktop: Donut Breakdown + Cash Flow Velocity */}
          <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
            {/* CHART 2: Envelope Spending Breakdown (With Category Filter) */}
            <div className="bg-white dark:bg-[#18201C] rounded-2xl border border-[#E7EAE5] dark:border-[#27342D] p-5 shadow-2xs space-y-4 flex flex-col justify-between">
              <div className="space-y-3">
                <div className="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-2 pb-1 border-b border-[#E7EAE5]/60 dark:border-[#27342D]/60">
                  <h3 className="text-xs font-bold uppercase tracking-wider text-[#181C19] dark:text-[#F1F5F3]">
                    Envelope Spending Breakdown
                  </h3>

                  {/* Category Filter Pills: All | Needs | Wants | Savings */}
                  <div className="flex items-center space-x-1 p-1 bg-stone-100 dark:bg-[#121815] rounded-xl border border-[#E7EAE5] dark:border-[#27342D] self-start sm:self-auto overflow-x-auto no-scrollbar">
                    {[
                      { id: 'all', label: 'All' },
                      { id: 'needs', label: 'Needs' },
                      { id: 'wants', label: 'Wants' },
                      { id: 'savings', label: 'Savings' },
                    ].map((c) => (
                      <button
                        key={c.id}
                        type="button"
                        onClick={() => {
                          triggerAudio('click');
                          setCategoryFilter(c.id);
                        }}
                        className={`px-2 py-0.5 rounded-lg text-[10px] font-bold transition-all ${categoryFilter === c.id
                          ? 'bg-white dark:bg-[#1F6E58] text-[#1F6E58] dark:text-white shadow-2xs'
                          : 'text-[#647067] dark:text-[#8E9E94] hover:text-[#181C19]'
                          }`}
                      >
                        {c.label}
                      </button>
                    ))}
                  </div>
                </div>

                {/* SVG Donut Visual with Filtered Center Total */}
                <div className="flex items-center justify-center py-2 relative">
                  <svg className="w-36 h-36 transform -rotate-90" viewBox="0 0 36 36">
                    <circle
                      cx="18"
                      cy="18"
                      r="15.915"
                      fill="transparent"
                      stroke={isPink ? '#FFE4E6' : isDark ? '#27342D' : '#E8F3EE'}
                      strokeWidth="3.4"
                    />
                    {donutSegments.map((s) => (
                      <circle
                        key={s.id}
                        cx="18"
                        cy="18"
                        r="15.915"
                        fill="transparent"
                        stroke={s.color}
                        strokeWidth="3.4"
                        strokeDasharray={`${s.pct} ${100 - s.pct}`}
                        strokeDashoffset={`${100 - s.startPct}`}
                        strokeLinecap="round"
                        className="transition-all duration-500"
                      />
                    ))}
                  </svg>
                  <div className="absolute inset-0 flex flex-col items-center justify-center text-center pointer-events-none">
                    <span className="text-[10px] font-medium text-[#647067] dark:text-[#8E9E94] uppercase tracking-wider">
                      {categoryFilter === 'all' ? 'Total' : categoryFilter}
                    </span>
                    <span className="text-xs font-black text-[#181C19] dark:text-[#F1F5F3] num-font">
                      {formatPeso(filteredTotalSpent, { compact: true })}
                    </span>
                  </div>
                </div>

                {/* Breakdown List */}
                <div className="space-y-1.5 max-h-48 overflow-y-auto pr-1">
                  {donutSegments.length === 0 ? (
                    <div className="text-center py-4 text-xs text-[#647067] dark:text-[#8E9E94]">
                      No expenses logged in this category.
                    </div>
                  ) : (
                    donutSegments.map((s) => {
                      const isOver = s.spentCentavos > s.allocatedCentavos;
                      return (
                        <div
                          key={s.id}
                          className="flex items-center justify-between text-xs py-1.5 border-b border-[#E7EAE5]/60 dark:border-[#27342D]/60 last:border-0"
                        >
                          <div className="flex items-center space-x-2 min-w-0 pr-2">
                            <span className="w-2.5 h-2.5 rounded-full shrink-0" style={{ backgroundColor: s.color }} />
                            <div className="truncate">
                              <span className="font-bold text-[#181C19] dark:text-[#F1F5F3] block truncate">
                                {s.name}
                              </span>
                              {isOver && (
                                <span className="text-[9px] font-bold text-[#DC2626] bg-red-50 dark:bg-red-950/40 px-1 py-0.2 rounded-xs">
                                  Over budget
                                </span>
                              )}
                            </div>
                          </div>
                          <div className="flex items-center space-x-2 font-mono shrink-0">
                            <span className="text-[11px] text-[#647067] dark:text-[#8E9E94]">
                              {Math.round(s.pct)}%
                            </span>
                            <span className="font-bold text-[#181C19] dark:text-[#F1F5F3]">
                              {formatPeso(s.spentCentavos)}
                            </span>
                          </div>
                        </div>
                      );
                    })
                  )}
                </div>
              </div>
            </div>

            {/* CHART 3: Cash Flow Velocity (Inflow vs Outflow with Wallet Filter) */}
            <div className="bg-white dark:bg-[#18201C] rounded-2xl border border-[#E7EAE5] dark:border-[#27342D] p-5 shadow-2xs space-y-4 flex flex-col justify-between">
              <div className="space-y-3">
                <div className="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-2 pb-1 border-b border-[#E7EAE5]/60 dark:border-[#27342D]/60">
                  <div>
                    <h3 className="text-xs font-bold uppercase tracking-wider text-[#181C19] dark:text-[#F1F5F3]">
                      Cash Flow &amp; Savings Retention
                    </h3>
                    <p className="text-[11px] text-[#647067] dark:text-[#8E9E94]">
                      Inflow vs Outflow by account
                    </p>
                  </div>

                  {/* Wallet Filter Selector */}
                  <select
                    value={cashflowWalletFilter}
                    onChange={(e) => {
                      triggerAudio('click');
                      setCashflowWalletFilter(e.target.value);
                    }}
                    className="h-8 px-2 rounded-lg bg-stone-100 dark:bg-[#121815] border border-[#E7EAE5] dark:border-[#27342D] text-[11px] font-bold text-[#181C19] dark:text-[#F1F5F3]"
                  >
                    <option value="all">All Accounts</option>
                    {state.wallets.map((w) => (
                      <option key={w.id} value={w.id}>
                        {w.name}
                      </option>
                    ))}
                  </select>
                </div>

                {/* Comparative Cash Flow Meters */}
                <div className="space-y-3 pt-1">
                  <div>
                    <div className="flex items-center justify-between text-xs mb-1">
