    // --- Modal: Log Income & Envelope Allocation ---
    function PaydaySplitModal({ wallets, buckets, onClose, onSubmit, triggerAudio }) {
      const [income, setIncome] = useState('25000');
      const [mode, setMode] = useState('later'); // 'later' (default: quick save, zero friction) vs 'now' (split right away)
      const [selectedWalletId, setSelectedWalletId] = useState(() => {
        return wallets.find((w) => w.id === 'wallet-gcash' || w.name?.toLowerCase().includes('gcash'))?.id || wallets[0]?.id || 'wallet-gcash';
      });

      // User custom percentages per envelope (used if mode === 'now')
      const [splits, setSplits] = useState(() => {
        return buckets.map((b) => {
          if (b.id === 'bucket-food') return { bucketId: b.id, percentage: 30 };
          if (b.id === 'bucket-transport') return { bucketId: b.id, percentage: 10 };
          if (b.id === 'bucket-bills') return { bucketId: b.id, percentage: 10 };
          if (b.id === 'bucket-wants') return { bucketId: b.id, percentage: 30 };
          if (b.id === 'bucket-savings') return { bucketId: b.id, percentage: 20 };
          return { bucketId: b.id, percentage: 0 };
        });
      });

      const centavos = toCentavos(income);
      const totalPct = splits.reduce((sum, s) => sum + s.percentage, 0);
      const isSplitValid = totalPct === 100 && centavos > 0;
      const isLaterValid = centavos > 0;

      const handlePctChange = (id, val) => {
        triggerAudio('click');
        const p = Math.max(0, Math.min(100, Math.round(val)));
        setSplits((prev) => prev.map((s) => s.bucketId === id ? { ...s, percentage: p } : s));
      };

      const handleConfirm = () => {
        if (mode === 'later') {
          if (!isLaterValid) return;
          onSubmit({
            amountCentavos: centavos,
            walletId: selectedWalletId,
            shouldSplit: false,
            isBonus: false,
          });
          onClose();
        } else {
          if (!isSplitValid) return;
          onSubmit({
            amountCentavos: centavos,
            walletId: selectedWalletId,
            shouldSplit: true,
            splitAllocationCentavos: centavos,
            splitTimes: 1,
            splits,
            isBonus: false,
          });
          onClose();
        }
      };

      return (
        <div className="fixed inset-0 z-50 flex items-end sm:items-center justify-center bg-black/60 backdrop-blur-xs p-0 sm:p-4 animate-in fade-in duration-150">
          <div className="fixed inset-0" onClick={onClose} />
          <div className="relative w-full max-w-md bg-white dark:bg-[#18201C] rounded-t-3xl sm:rounded-2xl shadow-2xl border border-[#E7EAE5] dark:border-[#27342D] max-h-[90vh] overflow-y-auto p-4 sm:p-5 z-10 animate-in slide-in-from-bottom duration-200">
            {/* Header */}
            <div className="flex items-center justify-between pb-3 border-b border-[#E7EAE5] dark:border-[#27342D]">
              <div>
                <h3 className="text-sm sm:text-base font-bold text-[#181C19] dark:text-[#F1F5F3]">
                  Log Paycheck
                </h3>
                <p className="text-[11px] text-[#647067] dark:text-[#8E9E94]">
                  Synced directly with GCash • Save now or allocate immediately
                </p>
              </div>
              <button onClick={onClose} type="button" className="text-xs font-bold text-[#647067] dark:text-[#8E9E94] p-1.5 hover:text-[#181C19]">✕</button>
            </div>

            {/* Mode Switcher: Quick Save (Allocate Later) vs Allocate Now */}
            <div className="grid grid-cols-2 gap-1.5 p-1 bg-[#F8F9F7] dark:bg-[#121815] rounded-xl border border-[#E7EAE5] dark:border-[#27342D] my-3.5">
              <button
                type="button"
                onClick={() => { triggerAudio('click'); setMode('later'); }}
                className={`py-2 px-3 rounded-lg text-xs font-bold transition-all text-center ${mode === 'later'
                  ? 'bg-white dark:bg-[#18201C] text-[#1F6E58] dark:text-[#2ABF9E] shadow-2xs'
                  : 'text-[#647067] dark:text-[#8E9E94] hover:text-[#181C19]'
                  }`}
              >
                Quick Save (Allocate Later)
              </button>
              <button
                type="button"
                onClick={() => { triggerAudio('click'); setMode('now'); }}
                className={`py-2 px-3 rounded-lg text-xs font-bold transition-all text-center ${mode === 'now'
                  ? 'bg-white dark:bg-[#18201C] text-[#1F6E58] dark:text-[#2ABF9E] shadow-2xs'
                  : 'text-[#647067] dark:text-[#8E9E94] hover:text-[#181C19]'
                  }`}
              >
                Allocate Now
              </button>
            </div>

            {/* Income Amount */}
            <div className="space-y-1 mb-3">
              <label className="text-xs font-bold uppercase tracking-wider text-[#181C19] dark:text-[#F1F5F3]">
                Paycheck Amount (₱)
              </label>
              <div className="relative">
                <span className="absolute left-3.5 top-1/2 -translate-y-1/2 font-bold text-lg text-[#1F6E58] dark:text-[#2ABF9E]">₱</span>
                <input
                  type="number"
                  value={income}
                  onChange={(e) => setIncome(e.target.value)}
                  className="w-full h-11 pl-8 pr-3 rounded-xl bg-[#F8F9F7] dark:bg-[#121815] border border-[#E7EAE5] dark:border-[#27342D] text-lg font-extrabold text-[#181C19] dark:text-[#F1F5F3] focus:outline-hidden focus:border-[#1F6E58] dark:focus:border-[#2ABF9E]"
                  placeholder="25,000"
                />
              </div>

              {/* Quick Amount Chips */}
              <div className="flex items-center space-x-1.5 pt-1.5 overflow-x-auto no-scrollbar">
                {['15000', '20000', '25000', '30000', '40000'].map((chipVal) => (
                  <button
                    key={chipVal}
                    type="button"
                    onClick={() => { triggerAudio('click'); setIncome(chipVal); }}
                    className={`px-2.5 py-1 rounded-lg text-[11px] font-bold shrink-0 transition-all ${income === chipVal
                      ? 'bg-[#1F6E58] dark:bg-[#2ABF9E] text-white dark:text-[#0F1412]'
                      : 'bg-[#F8F9F7] dark:bg-[#121815] text-[#647067] dark:text-[#8E9E94] border border-[#E7EAE5] dark:border-[#27342D]'
                      }`}
                  >
                    ₱{Number(chipVal).toLocaleString()}
                  </button>
                ))}
              </div>
            </div>

            {/* Receiving Wallet Selector */}
            <div className="space-y-1 mb-3">
              <label className="text-xs font-bold uppercase tracking-wider text-[#181C19] dark:text-[#F1F5F3]">
                Receiving Account
              </label>
              <div className="grid grid-cols-2 gap-2">
                {wallets.map((w) => {
                  const isSelected = selectedWalletId === w.id;
                  return (
                    <button
                      key={w.id}
                      type="button"
                      onClick={() => { triggerAudio('click'); setSelectedWalletId(w.id); }}
                      className={`p-2.5 rounded-xl border text-left transition-all ${isSelected
                        ? 'border-[#1F6E58] dark:border-[#2ABF9E] bg-[#E8F3EE] dark:bg-[#153228]'
                        : 'border-[#E7EAE5] dark:border-[#27342D] bg-[#F8F9F7] dark:bg-[#121815]'
                        }`}
                    >
                      <span className="font-bold text-xs text-[#181C19] dark:text-[#F1F5F3] block truncate">
                        {w.name}
                      </span>
                      <span className="text-[10px] text-[#647067] dark:text-[#8E9E94]">
                        {formatPeso(w.balanceCentavos)}
                      </span>
                    </button>
                  );
                })}
              </div>
            </div>

            {/* Mode-Specific Content */}
            {mode === 'later' ? (
              <div className="p-3.5 rounded-xl bg-[#E8F3EE] dark:bg-[#153228] border border-[#1F6E58]/20 dark:border-[#2ABF9E]/20 mb-4 space-y-1.5">
                <div className="flex items-center space-x-1.5 text-xs font-bold text-[#1F6E58] dark:text-[#2ABF9E]">
                  <IconShieldCheck className="w-4 h-4 shrink-0" />
                  <span>No Rush • Budget at Your Own Pace</span>
                </div>
                <p className="text-[11px] text-[#647067] dark:text-[#8E9E94] leading-relaxed">
                  Your paycheck will be added to your account balance and placed into your <strong>Ready to Allocate</strong> pool. You can assign it to envelopes anytime without pressure.
                </p>
              </div>
            ) : (
              <div className="space-y-2 mb-4">
                <div className="flex items-center justify-between">
                  <label className="text-xs font-bold uppercase tracking-wider text-[#181C19] dark:text-[#F1F5F3]">
                    Envelope Percentages (%)
                  </label>
                  <span className={`text-[11px] font-bold px-2 py-0.5 rounded-md ${isSplitValid
                    ? 'bg-green-50 dark:bg-green-950/40 text-[#15803D] dark:text-[#34D399]'
                    : totalPct < 100
                      ? 'bg-amber-50 dark:bg-amber-950/40 text-amber-600 dark:text-amber-400'
                      : 'bg-red-50 dark:bg-red-950/40 text-[#DC2626]'
                    }`}>
                    {isSplitValid ? 'Total: 100% (Balanced)' : `Total: ${totalPct}% / 100% (${totalPct < 100 ? `${100 - totalPct}% remaining` : `${totalPct - 100}% over`})`}
                  </span>
                </div>

                <div className="space-y-2.5 bg-[#F8F9F7] dark:bg-[#121815] p-3 rounded-xl border border-[#E7EAE5] dark:border-[#27342D] max-h-56 overflow-y-auto">
                  {splits.map((s) => {
                    const b = buckets.find((item) => item.id === s.bucketId);
                    if (!b) return null;
                    const previewAmt = calculateSplit(centavos, s.percentage);
                    return (
                      <div key={s.bucketId} className="space-y-1">
                        <div className="flex justify-between items-center text-xs">
                          <span className="font-semibold text-[#181C19] dark:text-[#F1F5F3] truncate max-w-[170px]">
                            {b.name}
                          </span>
                          <div className="flex items-center space-x-2">
                            <span className="font-bold text-[#1F6E58] dark:text-[#2ABF9E] num-font">
                              {formatPeso(previewAmt)}
                            </span>
                            <div className="flex items-center">
                              <input
                                type="number"
                                min="0"
                                max="100"
                                value={s.percentage}
                                onChange={(e) => handlePctChange(s.bucketId, parseInt(e.target.value, 10) || 0)}
                                className="w-12 h-6 text-center text-xs font-bold rounded-md bg-white dark:bg-[#18201C] border border-[#E7EAE5] dark:border-[#27342D] text-[#181C19] dark:text-[#F1F5F3]"
                              />
                              <span className="text-xs font-bold text-[#647067] dark:text-[#8E9E94] ml-0.5">%</span>
                            </div>
                          </div>
                        </div>
                        <input
                          type="range"
                          min="0"
                          max="100"
                          step="1"
                          value={s.percentage}
                          onChange={(e) => handlePctChange(s.bucketId, parseInt(e.target.value, 10) || 0)}
                          className="w-full accent-[#1F6E58] dark:accent-[#2ABF9E]"
                        />
                      </div>
                    );
                  })}
                </div>
              </div>
            )}

            {/* Confirm Action Button */}
            <button
              onClick={handleConfirm}
              disabled={mode === 'later' ? !isLaterValid : !isSplitValid}
              type="button"
              className="w-full h-11 sm:h-12 rounded-xl bg-[#1F6E58] dark:bg-[#2ABF9E] text-white dark:text-[#0F1412] font-bold text-sm shadow-md active:scale-95 transition-all disabled:opacity-50"
            >
              {mode === 'later'
                ? `Save Paycheck (${formatPeso(centavos)}) • Budget Later`
                : isSplitValid
                  ? `Confirm & Allocate (${formatPeso(centavos)})`
                  : `Allocate 100% to Confirm`}
            </button>
          </div>
        </div>
      );
    }

    // --- Modal: Allocate from Ready-to-Budget Pool ---
    function AllocateFundsModal({ unallocatedCentavos, buckets, onClose, onSubmit, triggerAudio }) {
      const defaultPesos = Math.floor(unallocatedCentavos / 100).toString();
      const [amountStr, setAmountStr] = useState(defaultPesos);

      const [splits, setSplits] = useState(() => {
        return buckets.map((b) => {
          if (b.id === 'bucket-food') return { bucketId: b.id, percentage: 30 };
          if (b.id === 'bucket-transport') return { bucketId: b.id, percentage: 10 };
          if (b.id === 'bucket-bills') return { bucketId: b.id, percentage: 10 };
          if (b.id === 'bucket-wants') return { bucketId: b.id, percentage: 30 };
          if (b.id === 'bucket-savings') return { bucketId: b.id, percentage: 20 };
          return { bucketId: b.id, percentage: 0 };
        });
      });

      const centavosToAllocate = toCentavos(amountStr);
      const totalPct = splits.reduce((sum, s) => sum + s.percentage, 0);
      const isValid = totalPct === 100 && centavosToAllocate > 0 && centavosToAllocate <= unallocatedCentavos;

      const handlePctChange = (id, val) => {
        triggerAudio('click');
        const p = Math.max(0, Math.min(100, Math.round(val)));
        setSplits((prev) => prev.map((s) => s.bucketId === id ? { ...s, percentage: p } : s));
      };

      const handleConfirm = () => {
        if (!isValid) return;
        onSubmit({
          amountCentavos: centavosToAllocate,
          splits,
        });
        onClose();
      };

      return (
        <div className="fixed inset-0 z-50 flex items-end sm:items-center justify-center bg-black/60 backdrop-blur-xs p-0 sm:p-4 animate-in fade-in duration-150">
          <div className="fixed inset-0" onClick={onClose} />
          <div className="relative w-full max-w-md bg-white dark:bg-[#18201C] rounded-t-3xl sm:rounded-2xl shadow-2xl border border-[#E7EAE5] dark:border-[#27342D] max-h-[90vh] overflow-y-auto p-4 sm:p-5 z-10 animate-in slide-in-from-bottom duration-200">
            {/* Header */}
            <div className="flex items-center justify-between pb-3 border-b border-[#E7EAE5] dark:border-[#27342D]">
              <div>
                <h3 className="text-sm sm:text-base font-bold text-[#181C19] dark:text-[#F1F5F3]">
                  Allocate to Envelopes
                </h3>
                <p className="text-[11px] text-[#647067] dark:text-[#8E9E94]">
                  Assign your saved paycheck funds across your envelopes
                </p>
              </div>
              <button onClick={onClose} type="button" className="text-xs font-bold text-[#647067] dark:text-[#8E9E94] p-1.5 hover:text-[#181C19]">✕</button>
            </div>

            {/* Available Pool Banner */}
            <div className="p-3 rounded-xl bg-[#E8F3EE] dark:bg-[#153228] border border-[#1F6E58]/20 dark:border-[#2ABF9E]/20 my-3 flex items-center justify-between">
              <div>
                <span className="text-[10px] font-bold uppercase tracking-wider text-[#1F6E58] dark:text-[#2ABF9E] block">
                  Available in Pool
                </span>
                <span className="text-base font-extrabold text-[#181C19] dark:text-[#F1F5F3] num-font">
                  {formatPeso(unallocatedCentavos)}
                </span>
              </div>
              <button
                type="button"
                onClick={() => { triggerAudio('click'); setAmountStr(Math.floor(unallocatedCentavos / 100).toString()); }}
                className="px-2.5 py-1 rounded-lg bg-[#1F6E58] dark:bg-[#2ABF9E] text-white dark:text-[#0F1412] text-[11px] font-bold active:scale-95 transition-all"
              >
                Allocate All
              </button>
            </div>

            {/* Amount to Allocate Input */}
            <div className="space-y-1 mb-3">
              <label className="text-xs font-bold uppercase tracking-wider text-[#181C19] dark:text-[#F1F5F3]">
                Amount to Allocate (₱)
              </label>
              <div className="relative">
                <span className="absolute left-3.5 top-1/2 -translate-y-1/2 font-bold text-lg text-[#1F6E58] dark:text-[#2ABF9E]">₱</span>
                <input
                  type="number"
                  value={amountStr}
                  onChange={(e) => setAmountStr(e.target.value)}
                  className="w-full h-11 pl-8 pr-3 rounded-xl bg-[#F8F9F7] dark:bg-[#121815] border border-[#E7EAE5] dark:border-[#27342D] text-lg font-extrabold text-[#181C19] dark:text-[#F1F5F3] focus:outline-hidden focus:border-[#1F6E58] dark:focus:border-[#2ABF9E]"
                  placeholder="25,000"
                />
              </div>
              {centavosToAllocate > unallocatedCentavos && (
                <p className="text-[11px] text-[#DC2626] font-semibold pt-1">
                  Amount exceeds available pool ({formatPeso(unallocatedCentavos)})
                </p>
              )}
            </div>

            {/* Envelope Percentage Sliders & Inputs */}
            <div className="space-y-2 mb-4">
              <div className="flex items-center justify-between">
                <label className="text-xs font-bold uppercase tracking-wider text-[#181C19] dark:text-[#F1F5F3]">
                  Envelope Percentages (%)
                </label>
                <span className={`text-[11px] font-bold px-2 py-0.5 rounded-md ${totalPct === 100
                  ? 'bg-green-50 dark:bg-green-950/40 text-[#15803D] dark:text-[#34D399]'
                  : totalPct < 100
                    ? 'bg-amber-50 dark:bg-amber-950/40 text-amber-600 dark:text-amber-400'
                    : 'bg-red-50 dark:bg-red-950/40 text-[#DC2626]'
                  }`}>
                  {totalPct === 100 ? 'Total: 100% (Balanced)' : `Total: ${totalPct}% / 100% (${totalPct < 100 ? `${100 - totalPct}% remaining` : `${totalPct - 100}% over`})`}
                </span>
              </div>

              <div className="space-y-2.5 bg-[#F8F9F7] dark:bg-[#121815] p-3 rounded-xl border border-[#E7EAE5] dark:border-[#27342D] max-h-56 overflow-y-auto">
                {splits.map((s) => {
                  const b = buckets.find((item) => item.id === s.bucketId);
                  if (!b) return null;
                  const previewAmt = calculateSplit(centavosToAllocate, s.percentage);
                  return (
                    <div key={s.bucketId} className="space-y-1">
                      <div className="flex justify-between items-center text-xs">
                        <span className="font-semibold text-[#181C19] dark:text-[#F1F5F3] truncate max-w-[170px]">
                          {b.name}
                        </span>
                        <div className="flex items-center space-x-2">
                          <span className="font-bold text-[#1F6E58] dark:text-[#2ABF9E] num-font">
                            {formatPeso(previewAmt)}
                          </span>
                          <div className="flex items-center">
                            <input
                              type="number"
                              min="0"
                              max="100"
                              value={s.percentage}
                              onChange={(e) => handlePctChange(s.bucketId, parseInt(e.target.value, 10) || 0)}
                              className="w-12 h-6 text-center text-xs font-bold rounded-md bg-white dark:bg-[#18201C] border border-[#E7EAE5] dark:border-[#27342D] text-[#181C19] dark:text-[#F1F5F3]"
                            />
                            <span className="text-xs font-bold text-[#647067] dark:text-[#8E9E94] ml-0.5">%</span>
                          </div>
                        </div>
                      </div>
                      <input
                        type="range"
                        min="0"
                        max="100"
                        step="1"
                        value={s.percentage}
                        onChange={(e) => handlePctChange(s.bucketId, parseInt(e.target.value, 10) || 0)}
                        className="w-full accent-[#1F6E58] dark:accent-[#2ABF9E]"
                      />
                    </div>
                  );
                })}
              </div>
            </div>

            {/* Confirm Action Button */}
            <button
              onClick={handleConfirm}
              disabled={!isValid}
              type="button"
              className="w-full h-11 sm:h-12 rounded-xl bg-[#1F6E58] dark:bg-[#2ABF9E] text-white dark:text-[#0F1412] font-bold text-sm shadow-md active:scale-95 transition-all disabled:opacity-50"
            >
              {isValid
                ? `Confirm Allocation (${formatPeso(centavosToAllocate)})`
                : totalPct !== 100
                  ? `Allocate 100% to Confirm`
                  : centavosToAllocate <= 0
                    ? `Enter Amount to Allocate`
                    : `Amount Exceeds Pool`}
            </button>
          </div>
        </div>
      );
    }

    // --- Modal: Transfer Between Envelopes ---
    function TransferEnvelopesModal({ buckets, initialSourceId, initialTargetId, onClose, onSubmit, triggerAudio }) {
      const defaultSrc = initialSourceId || buckets.find((b) => b.id !== initialTargetId && (b.allocatedCentavos - b.spentCentavos) > 0)?.id || buckets[0]?.id;
      const defaultTgt = initialTargetId || buckets.find((b) => b.id !== defaultSrc)?.id || buckets[1]?.id;

      const [srcId, setSrcId] = useState(defaultSrc);
      const [tgtId, setTgtId] = useState(defaultTgt);
      const [amount, setAmount] = useState('500');

      const amtCentavos = toCentavos(amount);
      const srcBucket = buckets.find((b) => b.id === srcId);
      const tgtBucket = buckets.find((b) => b.id === tgtId);
      const srcSurplus = srcBucket ? (srcBucket.allocatedCentavos - srcBucket.spentCentavos) : 0;
      const tgtRemaining = tgtBucket ? (tgtBucket.allocatedCentavos - tgtBucket.spentCentavos) : 0;
      const isValid = srcId !== tgtId && amtCentavos > 0 && srcBucket && tgtBucket;

      // Swap From and To
      const handleSwap = () => {
        triggerAudio('click');
        setSrcId(tgtId);
        setTgtId(srcId);
      };

      // Set amount helpers
      const setQuickAmount = (pesos) => {
        triggerAudio('click');
        setAmount(pesos.toString());
      };

      const setMaxSurplus = () => {
        triggerAudio('click');
        if (srcSurplus > 0) {
          setAmount(toPesos(srcSurplus).toString());
        }
      };

      return (
        <div className="fixed inset-0 z-50 flex items-end sm:items-center justify-center bg-black/60 backdrop-blur-xs p-0 sm:p-4 animate-in fade-in duration-150">
          <div className="fixed inset-0" onClick={onClose} />
          <div className="relative w-full max-w-md bg-white dark:bg-[#18201C] rounded-t-3xl sm:rounded-2xl shadow-2xl border border-[#E7EAE5] dark:border-[#27342D] max-h-[90vh] overflow-y-auto p-4 sm:p-5 z-10 animate-in slide-in-from-bottom duration-200">
            {/* Header */}
            <div className="flex items-center justify-between pb-3 border-b border-[#E7EAE5] dark:border-[#27342D]">
              <div>
                <h3 className="text-sm sm:text-base font-bold text-[#181C19] dark:text-[#F1F5F3]">
                  Move Money Between Envelopes
                </h3>
                <p className="text-[11px] text-[#647067] dark:text-[#8E9E94]">
                  Transfer budget allocation to cover deficits or top up
                </p>
              </div>
              <button onClick={onClose} type="button" className="text-xs font-bold text-[#647067] dark:text-[#8E9E94] p-1.5 hover:text-[#181C19]">✕</button>
            </div>

            {/* From Envelope & Swap & To Envelope */}
            <div className="my-3 space-y-2.5">
              {/* From Envelope */}
              <div className="p-3 rounded-xl bg-[#F8F9F7] dark:bg-[#121815] border border-[#E7EAE5] dark:border-[#27342D]">
                <div className="flex items-center justify-between mb-1">
                  <span className="text-[10px] font-bold uppercase tracking-wider text-[#647067] dark:text-[#8E9E94]">
                    From (Deduct Budget)
                  </span>
                  {srcBucket && (
                    <span className={`text-[11px] font-bold ${srcSurplus > 0 ? 'text-[#1F6E58] dark:text-[#2ABF9E]' : 'text-[#DC2626]'}`}>
                      {formatPeso(srcSurplus)} available
                    </span>
                  )}
                </div>
                <select
                  value={srcId}
                  onChange={(e) => {
                    triggerAudio('click');
                    const newSrc = e.target.value;
                    setSrcId(newSrc);
                    if (newSrc === tgtId) {
                      const alt = buckets.find((b) => b.id !== newSrc)?.id;
                      if (alt) setTgtId(alt);
                    }
                  }}
                  className="w-full h-10 px-3 rounded-lg bg-white dark:bg-[#18201C] border border-[#E7EAE5] dark:border-[#27342D] text-xs font-bold text-[#181C19] dark:text-[#F1F5F3]"
                >
                  {buckets.map((b) => (
                    <option key={b.id} value={b.id}>
                      {b.name} ({formatPeso(b.allocatedCentavos - b.spentCentavos)})
                    </option>
                  ))}
                </select>
              </div>

              {/* 1-Tap Swap Direction Button */}
              <div className="flex justify-center -my-1 relative z-10">
                <button
                  type="button"
                  onClick={handleSwap}
                  className="px-3 py-1 rounded-full bg-white dark:bg-[#18201C] border border-[#E7EAE5] dark:border-[#27342D] shadow-xs text-xs font-bold text-[#1F6E58] dark:text-[#2ABF9E] hover:bg-[#E8F3EE] active:scale-95 transition-all flex items-center space-x-1"
                  title="Swap From and To envelopes"
                >
                  <IconArrowRightLeft className="w-3.5 h-3.5" />
                  <span>Swap Direction</span>
                </button>
              </div>

              {/* To Envelope */}
              <div className="p-3 rounded-xl bg-[#F8F9F7] dark:bg-[#121815] border border-[#E7EAE5] dark:border-[#27342D]">
                <div className="flex items-center justify-between mb-1">
                  <span className="text-[10px] font-bold uppercase tracking-wider text-[#647067] dark:text-[#8E9E94]">
                    To (Add Budget)
                  </span>
                  {tgtBucket && (
                    <span className="text-[11px] font-bold text-[#1F6E58] dark:text-[#2ABF9E]">
                      Current: {formatPeso(tgtRemaining)}
                    </span>
                  )}
                </div>
                <select
                  value={tgtId}
                  onChange={(e) => {
                    triggerAudio('click');
                    const newTgt = e.target.value;
                    setTgtId(newTgt);
                    if (newTgt === srcId) {
                      const alt = buckets.find((b) => b.id !== newTgt)?.id;
                      if (alt) setSrcId(alt);
                    }
                  }}
                  className="w-full h-10 px-3 rounded-lg bg-white dark:bg-[#18201C] border border-[#E7EAE5] dark:border-[#27342D] text-xs font-bold text-[#181C19] dark:text-[#F1F5F3]"
                >
                  {buckets.map((b) => (
                    <option key={b.id} value={b.id}>
                      {b.name} ({formatPeso(b.allocatedCentavos - b.spentCentavos)})
                    </option>
                  ))}
                </select>
              </div>
            </div>

            {/* Transfer Amount Input & Quick Chips */}
            <div className="mb-4 space-y-1.5">
              <label className="text-[11px] font-bold uppercase tracking-wider text-[#647067] dark:text-[#8E9E94]">
                Transfer Amount (₱)
              </label>
              <div className="relative">
                <span className="absolute left-3.5 top-1/2 -translate-y-1/2 font-bold text-base text-[#1F6E58] dark:text-[#2ABF9E]">₱</span>
                <input
                  type="number"
                  value={amount}
                  onChange={(e) => setAmount(e.target.value)}
                  className="w-full h-11 pl-8 pr-3 rounded-xl bg-[#F8F9F7] dark:bg-[#121815] border border-[#E7EAE5] dark:border-[#27342D] text-base font-bold text-[#181C19] dark:text-[#F1F5F3]"
                />
              </div>

              {/* Quick Amount Chips */}
              <div className="flex flex-wrap items-center gap-1.5 pt-1">
                {[100, 200, 500, 1000].map((val) => (
                  <button
                    key={val}
                    type="button"
                    onClick={() => setQuickAmount(val)}
                    className="px-2.5 py-1 rounded-lg text-xs font-semibold bg-white dark:bg-[#121815] border border-[#E7EAE5] dark:border-[#27342D] text-[#181C19] dark:text-[#F1F5F3] hover:bg-stone-100 active:scale-95 transition-all"
                  >
                    +₱{val}
                  </button>
                ))}
                {srcSurplus > 0 && (
                  <button
                    type="button"
                    onClick={setMaxSurplus}
                    className="px-2.5 py-1 rounded-lg text-xs font-bold bg-[#E8F3EE] dark:bg-[#153228] text-[#1F6E58] dark:text-[#2ABF9E] border border-[#1F6E58]/30 active:scale-95 transition-all"
                  >
                    All Surplus ({formatPeso(srcSurplus)})
                  </button>
                )}
              </div>

              {/* Over-surplus warning */}
              {srcBucket && amtCentavos > srcSurplus && (
                <p className="text-[11px] text-amber-600 dark:text-amber-400 font-semibold pt-0.5">
                  Note: Amount exceeds available surplus ({formatPeso(srcSurplus)}) and will reduce {srcBucket.name}'s initial allocation.
                </p>
              )}
            </div>

            <button
              onClick={() => {
                if (isValid) {
                  onSubmit(srcId, tgtId, amtCentavos);
                  onClose();
                }
              }}
              disabled={!isValid}
              type="button"
              className="w-full h-11 sm:h-12 rounded-xl bg-[#1F6E58] dark:bg-[#2ABF9E] text-white dark:text-[#0F1412] font-bold text-sm shadow-md active:scale-95 transition-all disabled:opacity-50"
            >
              Confirm Transfer ({formatPeso(amtCentavos)})
            </button>
          </div>
        </div>
      );
    }

    // --- Modal: Reconcile Wallet ---
    function ReconcileWalletModal({ wallet, onClose, onSubmit, triggerAudio }) {
      if (!wallet) return null;
      const [val, setVal] = useState(toPesos(wallet.balanceCentavos).toString());
      const newCentavos = toCentavos(val);

      return (
        <div className="fixed inset-0 z-50 flex items-end sm:items-center justify-center bg-black/60 backdrop-blur-xs p-0 sm:p-4">
          <div className="fixed inset-0" onClick={onClose} />
          <div className="relative w-full max-w-md bg-white dark:bg-[#18201C] rounded-t-3xl sm:rounded-2xl shadow-2xl border border-[#E7EAE5] dark:border-[#27342D] p-5 z-10">
            <div className="flex items-center justify-between pb-3 border-b border-[#E7EAE5] dark:border-[#27342D]">
              <div>
                <h3 className="text-sm font-bold text-[#181C19] dark:text-[#F1F5F3]">Reconcile {wallet.name}</h3>
                <p className="text-[11px] text-[#647067] dark:text-[#8E9E94]">Adjust to match actual verified balance</p>
              </div>
              <button onClick={onClose} type="button" className="text-xs font-bold text-[#647067] dark:text-[#8E9E94] p-1">✕</button>
            </div>

            <div className="my-3 space-y-1">
              <label className="text-xs font-bold uppercase text-[#647067] dark:text-[#8E9E94]">Actual Verified Balance (₱)</label>
              <input
                type="number"
                step="any"
                value={val}
                onChange={(e) => setVal(e.target.value)}
                className="w-full h-11 px-3 rounded-xl bg-white dark:bg-[#121815] border border-[#E7EAE5] dark:border-[#27342D] text-lg font-bold text-[#181C19] dark:text-[#F1F5F3]"
              />
            </div>

            <button
              onClick={() => {
                onSubmit(wallet.id, newCentavos);
                onClose();
              }}
              type="button"
              className="w-full h-11 rounded-xl bg-[#1F6E58] dark:bg-[#2ABF9E] text-white dark:text-[#0F1412] font-bold text-sm shadow-md active:scale-95 transition-all"
            >
              Save Balance ({formatPeso(newCentavos)})
            </button>
          </div>
        </div>
      );
    }

    // --- Modal: Direct GCash Cash-In & Balance Reflector ---
    function GCashCashInModal({ wallet, onClose, onSubmit, triggerAudio }) {
      const [amount, setAmount] = useState('');
      const [note, setNote] = useState('');
      const [refNo, setRefNo] = useState('');
      const [pasteText, setPasteText] = useState('');
      const [showPaste, setShowPaste] = useState(false);
      const [parseError, setParseError] = useState('');

      const baseCentavos = toCentavos(amount);

      const handleAddPreset = (p) => {
        triggerAudio('click');
        const curr = parseFloat(amount) || 0;
        setAmount((curr + p).toString());
      };

      const handleParse = () => {
        triggerAudio('click');
        const text = pasteText;
        const amountMatch = text.match(/PHP\s*([\d,]+\.?\d*)/i);
        const parsedAmt = amountMatch ? parseFloat(amountMatch[1].replace(/,/g, '')) : null;
        if (!parsedAmt || parsedAmt <= 0) {
          setParseError('Could not find "PHP XXX.XX" amount in the text.');
          return;
        }
        const sourceMatch = text.match(/(?:received|cashed\s+in)\s+PHP[\d,.\s]+(?:of\s+GCash\s+)?(?:from|via)\s+(.+?)(?:\.|Ref|on\s|\n|$)/i);
        const parsedSource = sourceMatch ? sourceMatch[1].trim() : '';
        const refMatch = text.match(/Ref(?:erence)?\.?\s*No\.?\s*[:\s]?\s*([A-Z0-9]+)/i);
        const parsedRef = refMatch ? refMatch[1] : '';

        setAmount(parsedAmt.toString());
        if (parsedSource) setNote(parsedSource);
        if (parsedRef) setRefNo(parsedRef);
        setParseError('');
        setShowPaste(false);
      };

      const handleConfirm = () => {
        if (baseCentavos <= 0) return;
        triggerAudio('click');
        onSubmit({
          amountCentavos: baseCentavos,
          note: note.trim() || 'Direct Cash-In',
          refNo: refNo.trim(),
        });
        onClose();
      };

      return (
        <div className="fixed inset-0 z-50 flex items-end sm:items-center justify-center bg-black/60 backdrop-blur-xs p-0 sm:p-4 animate-in fade-in duration-150">
          <div className="fixed inset-0" onClick={onClose} />
          <div className="relative w-full max-w-md bg-white dark:bg-[#18201C] rounded-t-3xl sm:rounded-2xl shadow-2xl border border-[#E7EAE5] dark:border-[#27342D] p-5 z-10 max-h-[90vh] overflow-y-auto">
            {/* Grab pill for mobile */}
            <div className="w-12 h-1.5 bg-[#E7EAE5] dark:bg-[#27342D] rounded-full mx-auto mb-3 sm:hidden" />

            {/* Header */}
            <div className="flex items-center justify-between pb-3 border-b border-[#E7EAE5] dark:border-[#27342D]">
              <div className="flex items-center space-x-2.5">
                <div className="w-9 h-9 rounded-xl bg-[#1F6E58] dark:bg-[#2ABF9E] text-white dark:text-[#0F1412] flex items-center justify-center font-bold text-sm shadow-xs">
                  <IconArrowDownLeft className="w-4 h-4 text-white dark:text-[#0F1412]" />
                </div>
                <div>
                  <div className="flex items-center gap-1.5">
                    <h3 className="text-sm font-bold text-[#181C19] dark:text-[#F1F5F3]">GCash Cash-In</h3>
                    <span className="text-[9px] font-extrabold uppercase px-1.5 py-0.5 rounded-full bg-[#E8F3EE] dark:bg-[#153228] text-[#1F6E58] dark:text-[#2ABF9E]">
                      Auto-Reflect
                    </span>
                  </div>
                  <p className="text-[11px] text-[#647067] dark:text-[#8E9E94]">
                    Current Balance: <span className="font-bold text-[#181C19] dark:text-[#F1F5F3]">{formatPeso(wallet?.balanceCentavos || 0)}</span>
                  </p>
                </div>
              </div>
              <button
                onClick={onClose}
                type="button"
                className="w-8 h-8 rounded-full flex items-center justify-center text-[#647067] dark:text-[#8E9E94] hover:bg-stone-100 dark:hover:bg-stone-800 font-bold active:scale-95"
              >
                ✕
              </button>
            </div>

            <div className="space-y-3.5 my-3.5">
              {/* Cash-In Amount */}
              <div>
                <div className="flex items-center justify-between mb-1">
                  <label className="text-[11px] font-bold uppercase text-[#647067] dark:text-[#8E9E94]">Cash-In Amount (₱)</label>
                  {baseCentavos > 0 && (
                    <span className="text-xs font-extrabold text-[#1F6E58] dark:text-[#2ABF9E]">
                      New Balance: {formatPeso((wallet?.balanceCentavos || 0) + baseCentavos)}
                    </span>
                  )}
                </div>
                <input
                  type="number"
                  step="any"
                  value={amount}
                  onChange={(e) => setAmount(e.target.value)}
                  placeholder="0.00"
                  autoFocus
                  className="w-full h-12 px-3 rounded-xl bg-[#F8F9F7] dark:bg-[#121815] border border-[#E7EAE5] dark:border-[#27342D] text-xl font-bold text-[#181C19] dark:text-[#F1F5F3] focus:outline-hidden focus:border-[#1F6E58] dark:focus:border-[#2ABF9E]"
                />
              </div>

              {/* Quick Preset Chips */}
              <div className="grid grid-cols-4 gap-1.5">
                {[100, 500, 1000, 2000].map((p) => (
                  <button
                    key={p}
                    type="button"
                    onClick={() => handleAddPreset(p)}
                    className="py-1.5 rounded-lg border border-[#E7EAE5] dark:border-[#27342D] bg-stone-50 dark:bg-stone-800 text-xs font-bold text-[#1F6E58] dark:text-[#2ABF9E] active:scale-95"
                  >
                    +₱{p}
                  </button>
                ))}
              </div>

              {/* Source / Note */}
              <div>
                <label className="text-[11px] font-bold uppercase text-[#647067] dark:text-[#8E9E94]">
                  Source / Bank <span className="font-normal normal-case">(optional)</span>
                </label>
                <input
                  type="text"
                  value={note}
                  onChange={(e) => setNote(e.target.value)}
                  placeholder="e.g. BPI, BDO, UnionBank, 7-Eleven, Payroll"
                  className="w-full h-10 px-3 rounded-xl bg-[#F8F9F7] dark:bg-[#121815] border border-[#E7EAE5] dark:border-[#27342D] text-xs font-semibold text-[#181C19] dark:text-[#F1F5F3] focus:outline-hidden focus:border-[#1F6E58] dark:focus:border-[#2ABF9E]"
                />
              </div>

              {/* Reference Number */}
              <div>
                <label className="text-[11px] font-bold uppercase text-[#647067] dark:text-[#8E9E94]">
                  Reference Number <span className="font-normal normal-case">(optional)</span>
                </label>
                <input
                  type="text"
                  value={refNo}
                  onChange={(e) => setRefNo(e.target.value)}
                  placeholder="e.g. 1029384756"
                  className="w-full h-10 px-3 rounded-xl bg-[#F8F9F7] dark:bg-[#121815] border border-[#E7EAE5] dark:border-[#27342D] text-xs font-mono text-[#181C19] dark:text-[#F1F5F3] focus:outline-hidden focus:border-[#1F6E58] dark:focus:border-[#2ABF9E]"
                />
              </div>

              {/* Optional SMS Paste Drawer */}
              <div className="pt-1">
                <button
                  type="button"
                  onClick={() => setShowPaste(!showPaste)}
                  className="text-xs font-bold text-[#1F6E58] dark:text-[#2ABF9E] flex items-center space-x-1 hover:underline"
                >
                  <IconFileText className="w-3.5 h-3.5" />
