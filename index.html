    // --- Main Centavo Application Component ---
    function CentavoApp() {
      // Splash state
      const [showSplash, setShowSplash] = useState(true);

      // Theme State: 'light' | 'dark' | 'pink'
      const [theme, setTheme] = useState(() => {
        const saved = localStorage.getItem(THEME_KEY);
        if (saved === 'dark' || saved === 'light' || saved === 'pink') {
          return saved;
        }
        return 'light';
      });

      // Convenience theme booleans
      const isDark = theme === 'dark';
      const isPink = theme === 'pink';

      // Sound State
      const [soundEnabled, setSoundEnabled] = useState(() => {
        const saved = localStorage.getItem(SOUND_KEY);
        return saved !== 'false';
      });

      // App Storage State (handles migration from v1/v2 to v3 with savings goals)
      const [state, setState] = useState(() => {
        try {
          const raw = localStorage.getItem(STORAGE_KEY) || localStorage.getItem('centavo_offline_v2') || localStorage.getItem('centavo_offline_v1');
          if (raw) {
            const parsed = JSON.parse(raw);
            if (parsed && Array.isArray(parsed.buckets) && Array.isArray(parsed.wallets)) {
              return {
                ...INITIAL_STATE,
                ...parsed,
                version: 3,
                unallocatedCentavos: parsed.unallocatedCentavos || 0,
                recurringBills: parsed.recurringBills || INITIAL_STATE.recurringBills,
                savingsGoals: parsed.savingsGoals || INITIAL_STATE.savingsGoals,
                streakDays: parsed.streakDays || 3,
              };
            }
          }
        } catch (e) {
          console.warn('Fallback to seed data', e);
        }
        return INITIAL_STATE;
      });

      // Synchronize theme classes to html document element
      useEffect(() => {
        document.documentElement.classList.remove('dark', 'pink');
        if (theme === 'dark') {
          document.documentElement.classList.add('dark');
        } else if (theme === 'pink') {
          document.documentElement.classList.add('pink');
        }
        localStorage.setItem(THEME_KEY, theme);
      }, [theme]);

      // Persist state to local storage
      useEffect(() => {
        try {
          localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
        } catch (e) {
          console.error('Storage error', e);
        }
      }, [state]);

      // Navigation & Modals
      const [activeTab, setActiveTab] = useState('home'); // 'home' | 'envelopes' | 'analytics' | 'wallets'
      const [isQuickEntryOpen, setIsQuickEntryOpen] = useState(false);
      const [isGuideOpen, setIsGuideOpen] = useState(false);
      const [isPaydayOpen, setIsPaydayOpen] = useState(false);
      const [isAllocatePoolOpen, setIsAllocatePoolOpen] = useState(false);
      const [isAddBillOpen, setIsAddBillOpen] = useState(false);
      const [isAddEnvelopeOpen, setIsAddEnvelopeOpen] = useState(false);
      const [isAddWalletOpen, setIsAddWalletOpen] = useState(false);
      const [isDepositSavingsOpen, setIsDepositSavingsOpen] = useState(false);
      const [selectedSavingsGoalId, setSelectedSavingsGoalId] = useState(null);
      const [isAddSavingsGoalOpen, setIsAddSavingsGoalOpen] = useState(false);
      const [transferConfig, setTransferConfig] = useState(null); // { sourceId?: string, targetId?: string }
      const [reconcileWalletId, setReconcileWalletId] = useState(null);
      const [selectedCategoryFilter, setSelectedCategoryFilter] = useState('all');
      const [selectedMonthFilter, setSelectedMonthFilter] = useState('all');
      const [searchQuery, setSearchQuery] = useState('');
      const [currentTxPage, setCurrentTxPage] = useState(1);
      const TX_PAGE_SIZE = 5;
      const [isRebalanceOpen, setIsRebalanceOpen] = useState(false);
      const [rebalanceTargetBucketId, setRebalanceTargetBucketId] = useState(null);
      const [isGCashCashInOpen, setIsGCashCashInOpen] = useState(false);
      const [pendingGCashNotif, setPendingGCashNotif] = useState(null);
      const [statusToast, setStatusToast] = useState(null);
      const [animatingCoin, setAnimatingCoin] = useState(null);

      // Automated GCash Notification Processor (APK & Clipboard Bridge)
      const processGCashText = (text) => {
        if (!text || typeof text !== 'string') return;

        // Extract transaction amount
        const amountMatch = text.match(/PHP\s*([\d,]+\.?\d*)/i);
        const amount = amountMatch ? parseFloat(amountMatch[1].replace(/,/g, '')) : null;
        if (!amount || amount <= 0) return;
        const amountCentavos = Math.round(amount * 100);

        // Extract resulting new balance from GCash SMS (e.g. "Your new balance is PHP 1,234.56")
        const balMatch = text.match(/(?:new\s+bal(?:ance)?|your\s+bal(?:ance)?|bal(?:ance)?)\s*(?:is)?\s*[:]?\s*PHP\s*([\d,]+\.?\d*)/i);
        const newBalanceCentavos = balMatch ? Math.round(parseFloat(balMatch[1].replace(/,/g, '')) * 100) : null;

        // Extract Reference Number
        const refMatch = text.match(/Ref(?:erence)?\.?\s*No\.?\s*[:\s]?\s*([A-Z0-9]+)/i);
        const refNo = refMatch ? refMatch[1] : '';

        // Detect if this is a Cash-In / Received Money or a Payment / Sent Money
        const isCashIn = /(?:received|cashed\s+in|cash[- ]in|transferred.*to.*gcash|remittance)/i.test(text);

        if (isCashIn) {
          const sourceMatch = text.match(/(?:received|cashed\s+in)\s+PHP[\d,.\s]+(?:of\s+GCash\s+)?(?:from|via)\s+(.+?)(?:\.|Ref|on\s|\n|$)/i);
          const source = sourceMatch ? sourceMatch[1].trim() : 'Bank / Cash-In';

          setPendingGCashNotif({
            isCashIn: true,
            amountCentavos,
            newBalanceCentavos,
            source,
            refNo,
          });
        } else {
          const merchantMatch = text.match(/(?:paid|sent)\s+PHP[\d,.\s]+(?:of\s+GCash\s+)?to\s+(.+?)(?:\.|Ref|on\s|\n|$)/i);
          const merchant = merchantMatch ? merchantMatch[1].trim() : 'GCash Payment';

          setPendingGCashNotif({
            isCashIn: false,
            amountCentavos,
            newBalanceCentavos,
            merchant,
            refNo,
            bucketId: state.buckets[0]?.id || 'bucket-food',
          });
        }

        if (soundEnabled) playHapticSound('success');
      };

      // Expose globally for Android APK NotificationListenerService
      useEffect(() => {
        window.onGCashNotification = (rawText) => {
          processGCashText(rawText);
        };
      }, [state.buckets, soundEnabled]);

      const triggerAudio = (type = 'click') => {
        if (soundEnabled) playHapticSound(type);
      };

      const triggerCoinDrop = (text = '₱') => {
        setAnimatingCoin({ text });
        triggerAudio('coin');
        setTimeout(() => setAnimatingCoin(null), 1200);
      };

      const showToast = (msg, type = 'success') => {
        setStatusToast({ msg, type });
        triggerAudio('success');
        setTimeout(() => setStatusToast(null), 3000);
      };

      // Safe-to-Spend: sum of positive remaining discretionary buckets
      const safeToSpendCentavos = useMemo(() => {
        return state.buckets
          .filter((b) => b.isDiscretionary)
          .reduce((sum, b) => {
            const rem = b.allocatedCentavos - b.spentCentavos;
            return sum + Math.max(0, rem);
          }, 0);
      }, [state.buckets]);

      // Total liquid wallets
      const totalLiquidCentavos = useMemo(() => {
        return state.wallets.reduce((sum, w) => sum + w.balanceCentavos, 0);
      }, [state.wallets]);

      // Total saved across all savings goals
      const totalSavedCentavos = useMemo(() => {
        return (state.savingsGoals || []).reduce((sum, g) => sum + g.savedCentavos, 0);
      }, [state.savingsGoals]);

      // Daily Spend Pace calculation (adapts to customizable Payday Schedule)
      const { daysLeft, dailyPaceCentavos, nextPaydayLabel } = useMemo(() => {
        const now = new Date();
        const today = now.getDate();
        const daysInMonth = new Date(now.getFullYear(), now.getMonth() + 1, 0).getDate();
        const sched = state.paydaySchedule || '15_30';

        let daysRemaining;
        let label = 'Payday';

        if (sched === '15_30') {
          if (today <= 15) {
            daysRemaining = Math.max(1, 15 - today + 1);
            label = '15th Payday';
          } else {
            const endTarget = Math.min(30, daysInMonth);
            daysRemaining = Math.max(1, endTarget - today + 1);
            label = `${endTarget}th Payday`;
          }
        } else if (sched === '15') {
          if (today <= 15) {
            daysRemaining = Math.max(1, 15 - today + 1);
            label = '15th Payday';
          } else {
            daysRemaining = Math.max(1, (daysInMonth - today) + 15);
            label = '15th Payday';
          }
        } else {
          // 'end_of_month'
          daysRemaining = Math.max(1, daysInMonth - today + 1);
          label = 'End of Month';
        }

        const pace = Math.round(safeToSpendCentavos / daysRemaining);
        return {
          daysLeft: daysRemaining,
          dailyPaceCentavos: Math.max(0, pace),
          nextPaydayLabel: label,
        };
      }, [safeToSpendCentavos, state.paydaySchedule]);

      // Privacy mode toggle
      const togglePrivacyMode = () => {
        triggerAudio('click');
        setState((prev) => ({ ...prev, isPrivacyMode: !prev.isPrivacyMode }));
      };

      // Theme Toggle: Light (Sage & Paper) -> Dark (Obsidian) -> Baby Pink (Hello Kitty)
      const cycleTheme = () => {
        triggerAudio('click');
        setTheme((prev) => {
          if (prev === 'light') return 'dark';
          if (prev === 'dark') return 'pink';
          return 'light';
        });
      };

      // Toggle Sound
      const toggleSound = () => {
        const next = !soundEnabled;
        setSoundEnabled(next);
        localStorage.setItem(SOUND_KEY, next ? 'true' : 'false');
        if (next) playHapticSound('click');
      };

      // Add expense
      const handleAddExpense = ({ amountCentavos, bucketId, walletId, note, refNo }) => {
        if (amountCentavos <= 0) return;
        const newTx = {
          id: `tx-${Date.now()}`,
          type: 'expense',
          amountCentavos,
          bucketId,
          walletId,
          note: note || 'Quick Expense',
          refNo: refNo || '',
          timestamp: new Date().toISOString(),
        };

        setState((prev) => ({
          ...prev,
          wallets: prev.wallets.map((w) =>
            w.id === walletId ? { ...w, balanceCentavos: w.balanceCentavos - amountCentavos } : w
          ),
          buckets: prev.buckets.map((b) =>
            b.id === bucketId ? { ...b, spentCentavos: b.spentCentavos + amountCentavos } : b
          ),
          transactions: [newTx, ...prev.transactions],
        }));
        showToast(`Logged ${formatPeso(amountCentavos)} expense!`);
      };

      // GCash Cash-In Action handler: directly reflects cash-in into GCash balance
      const handleGCashCashIn = ({ amountCentavos, note, refNo }) => {
        if (amountCentavos <= 0) return;
        setState((prev) => ({
          ...prev,
          wallets: prev.wallets.map((w) =>
            w.id === 'wallet-gcash' ? { ...w, balanceCentavos: w.balanceCentavos + amountCentavos, updatedAt: new Date().toISOString() } : w
          ),
          transactions: [
            {
              id: `tx-gcash-${Date.now()}`,
              type: 'income',
              amountCentavos,
              walletId: 'wallet-gcash',
              bucketId: null,
              note: note ? `GCash Cash-In (${note})` : 'GCash Cash-In',
              refNo: refNo || '',
              timestamp: new Date().toISOString(),
            },
            ...prev.transactions,
          ],
        }));
        showToast(`Cashed in ${formatPeso(amountCentavos)} to GCash!`);
        triggerCoinDrop('₱');
      };

      // Deposit money into a Savings Goal with Milestone Celebrations
      const handleDepositSavings = (goalId, amountCentavos, walletId) => {
        if (amountCentavos <= 0) return;
        const goal = (state.savingsGoals || []).find((g) => g.id === goalId);
        const wallet = state.wallets.find((w) => w.id === walletId);
        if (!goal || !wallet) return;

        const prevSaved = goal.savedCentavos || 0;
        const newSaved = prevSaved + amountCentavos;
        const target = goal.targetCentavos || 1;

        const prevPct = Math.floor((prevSaved / target) * 100);
        const newPct = Math.floor((newSaved / target) * 100);

        const milestones = [25, 50, 75, 100];
        const celebrated = goal.celebratedMilestones || [];
        const crossedMilestone = milestones.find((m) => prevPct < m && newPct >= m && !celebrated.includes(m));

        const updatedGoals = (state.savingsGoals || []).map((g) => {
          if (g.id === goalId) {
            return {
              ...g,
              savedCentavos: newSaved,
              celebratedMilestones: crossedMilestone ? [...celebrated, crossedMilestone] : celebrated,
            };
          }
          return g;
        });

        const newTx = {
          id: `tx-save-${Date.now()}`,
          type: 'savings',
          amountCentavos,
          walletId,
          bucketId: 'bucket-savings',
          note: `Saved to ${goal.name}`,
          timestamp: new Date().toISOString(),
        };

        setState((prev) => ({
          ...prev,
          wallets: prev.wallets.map((w) =>
            w.id === walletId ? { ...w, balanceCentavos: w.balanceCentavos - amountCentavos } : w
          ),
          savingsGoals: updatedGoals,
          buckets: prev.buckets.map((b) =>
            b.id === 'bucket-savings' ? { ...b, allocatedCentavos: b.allocatedCentavos + amountCentavos } : b
          ),
          transactions: [newTx, ...prev.transactions],
        }));

        triggerCoinDrop(`+${formatPeso(amountCentavos)}`);
        if (crossedMilestone) {
          triggerCanvasConfetti();
          triggerAudio('chime');
          showToast(`Reached ${crossedMilestone}% milestone for ${goal.name}!`);
        } else {
          showToast(`Deposited ${formatPeso(amountCentavos)} to ${goal.name}!`);
        }
      };

      // Envelope "Cover & Borrow" (1-Tap Rebalancing)
      const handleCoverDeficit = (targetBucketId, donorBucketId, amountCentavos) => {
        if (amountCentavos <= 0) return;
        const targetBucket = state.buckets.find((b) => b.id === targetBucketId);
        const donorBucket = state.buckets.find((b) => b.id === donorBucketId);
        if (!targetBucket || !donorBucket) return;

        const newTx = {
          id: `tx-reb-${Date.now()}`,
          type: 'rebalance',
          amountCentavos,
          fromBucketId: donorBucketId,
          toBucketId: targetBucketId,
          bucketId: targetBucketId,
          note: `Covered ${targetBucket.name} deficit from ${donorBucket.name}`,
          timestamp: new Date().toISOString(),
        };

        setState((prev) => ({
          ...prev,
          buckets: prev.buckets.map((b) => {
            if (b.id === donorBucketId) {
              return { ...b, allocatedCentavos: b.allocatedCentavos - amountCentavos };
            }
            if (b.id === targetBucketId) {
              return { ...b, allocatedCentavos: b.allocatedCentavos + amountCentavos };
            }
            return b;
          }),
          transactions: [newTx, ...prev.transactions],
        }));

        triggerAudio('success');
        showToast(`Covered ${formatPeso(amountCentavos)} deficit from ${donorBucket.name}!`);
      };

      // Add custom savings goal
      const handleAddSavingsGoal = (newGoal) => {
        setState((prev) => ({
          ...prev,
          savingsGoals: [...(prev.savingsGoals || []), { ...newGoal, id: `goal-${Date.now()}` }],
        }));
        showToast(`Created savings goal: ${newGoal.name}`);
      };

      // Delete transaction
      const handleDeleteTransaction = (id) => {
        triggerAudio('click');
        const tx = state.transactions.find((t) => t.id === id);
        if (!tx) return;

        setState((prev) => {
          let wallets = [...prev.wallets];
          let buckets = [...prev.buckets];

          if (tx.type === 'expense') {
            wallets = wallets.map((w) =>
              w.id === tx.walletId ? { ...w, balanceCentavos: w.balanceCentavos + tx.amountCentavos } : w
            );
            if (tx.bucketId) {
              buckets = buckets.map((b) =>
                b.id === tx.bucketId
                  ? { ...b, spentCentavos: Math.max(0, b.spentCentavos - tx.amountCentavos) }
                  : b
              );
            }
          } else if (tx.type === 'income') {
            wallets = wallets.map((w) =>
              w.id === tx.walletId ? { ...w, balanceCentavos: w.balanceCentavos - tx.amountCentavos } : w
            );
          } else if (tx.type === 'savings') {
            wallets = wallets.map((w) =>
              w.id === tx.walletId ? { ...w, balanceCentavos: w.balanceCentavos + tx.amountCentavos } : w
            );
          }

          return {
            ...prev,
            wallets,
            buckets,
            transactions: prev.transactions.filter((t) => t.id !== id),
          };
        });
        showToast('Transaction removed');
      };

      // Transfer allocation between buckets
      const handleTransferBuckets = (sourceId, targetId, amountCentavos) => {
        if (sourceId === targetId || amountCentavos <= 0) return;
        const src = state.buckets.find((b) => b.id === sourceId);
        const tgt = state.buckets.find((b) => b.id === targetId);
        if (!src || !tgt) return;

        const newTx = {
          id: `tx-xfer-${Date.now()}`,
          type: 'transfer',
          amountCentavos,
          walletId: state.wallets[0]?.id || 'wallet-cash',
          bucketId: sourceId,
          targetBucketId: targetId,
          note: `Transfer from ${src.name} to ${tgt.name}`,
          timestamp: new Date().toISOString(),
        };

        setState((prev) => ({
          ...prev,
          buckets: prev.buckets.map((b) => {
            if (b.id === sourceId) return { ...b, allocatedCentavos: b.allocatedCentavos - amountCentavos };
            if (b.id === targetId) return { ...b, allocatedCentavos: b.allocatedCentavos + amountCentavos };
            return b;
          }),
          transactions: [newTx, ...prev.transactions],
        }));
        showToast(`Transferred ${formatPeso(amountCentavos)} to ${tgt.name}`);
      };

      // Log Income & Optional Envelope Splitting
      const handleLogPayday = ({ amountCentavos, walletId, splits, shouldSplit = true, splitAllocationCentavos, splitTimes = 1, isBonus = false }) => {
        if (amountCentavos <= 0) return;
        const allocCentavos = splitAllocationCentavos || amountCentavos;
        const exactSplits = shouldSplit && splits && splits.length > 0 ? distributeExact(allocCentavos, splits) : {};

        const noteText = isBonus
          ? `13th Month / Holiday Bonus (${formatPeso(amountCentavos)})`
          : shouldSplit
            ? `Paycheck Split (${formatPeso(allocCentavos)} into Envelopes)`
            : `Paycheck Received (${formatPeso(amountCentavos)} Ready to Allocate)`;

        const newTx = {
          id: `tx-payday-${Date.now()}`,
          type: 'income',
          amountCentavos,
          walletId,
          note: noteText,
          timestamp: new Date().toISOString(),
        };

        setState((prev) => ({
          ...prev,
          wallets: prev.wallets.map((w) =>
            w.id === walletId ? { ...w, balanceCentavos: w.balanceCentavos + amountCentavos } : w
          ),
          unallocatedCentavos: shouldSplit
            ? (prev.unallocatedCentavos || 0)
            : (prev.unallocatedCentavos || 0) + amountCentavos,
          buckets: shouldSplit
            ? prev.buckets.map((b) => ({
              ...b,
              allocatedCentavos: b.allocatedCentavos + (exactSplits[b.id] || 0),
            }))
            : prev.buckets,
          transactions: [newTx, ...prev.transactions],
        }));

        if (isBonus) {
          triggerCanvasConfetti();
          triggerAudio('chime');
          triggerCoinDrop(`+${formatPeso(amountCentavos)}`);
          showToast(`13th Month Bonus logged: ${formatPeso(amountCentavos)}!`);
        } else {
          triggerCoinDrop(`+${formatPeso(amountCentavos)}`);
          showToast(shouldSplit
            ? `Paycheck allocated into envelopes: ${formatPeso(amountCentavos)}!`
            : `Paycheck of ${formatPeso(amountCentavos)} saved! Ready to allocate anytime.`);
        }
      };

      // Allocate from Ready-to-Allocate Pool into Envelopes
      const handleAllocateFunds = ({ amountCentavos, splits }) => {
        if (amountCentavos <= 0 || !splits || splits.length === 0) return;
        const exactSplits = distributeExact(amountCentavos, splits);

        setState((prev) => ({
          ...prev,
          unallocatedCentavos: Math.max(0, (prev.unallocatedCentavos || 0) - amountCentavos),
          buckets: prev.buckets.map((b) => ({
            ...b,
            allocatedCentavos: b.allocatedCentavos + (exactSplits[b.id] || 0),
          })),
        }));

        triggerAudio('success');
        triggerCoinDrop(`+${formatPeso(amountCentavos)}`);
        showToast(`Allocated ${formatPeso(amountCentavos)} across envelopes!`);
      };

      // Reconcile wallet balance
      const handleReconcileWallet = (walletId, newCentavos, note) => {
        const wallet = state.wallets.find((w) => w.id === walletId);
        if (!wallet) return;
        const diff = newCentavos - wallet.balanceCentavos;
        if (diff === 0) return;

        const newTx = {
          id: `tx-rec-${Date.now()}`,
          type: diff > 0 ? 'income' : 'expense',
          amountCentavos: Math.abs(diff),
          walletId,
          note: note || `Balance adjustment (${wallet.name})`,
          timestamp: new Date().toISOString(),
        };

        setState((prev) => ({
          ...prev,
          wallets: prev.wallets.map((w) =>
            w.id === walletId ? { ...w, balanceCentavos: newCentavos } : w
          ),
          transactions: [newTx, ...prev.transactions],
        }));
        showToast(`Reconciled ${wallet.name} to ${formatPeso(newCentavos)}`);
      };

      // Pay recurring bill (1-tap action)
      const handlePayBill = (billId) => {
        triggerAudio('click');
        const bill = state.recurringBills.find((b) => b.id === billId);
        if (!bill) return;

        const newTx = {
          id: `tx-bill-${Date.now()}`,
          type: 'expense',
          amountCentavos: bill.amountCentavos,
          walletId: bill.walletId,
          bucketId: bill.bucketId,
          note: `Paid ${bill.name}`,
          timestamp: new Date().toISOString(),
        };

        setState((prev) => ({
          ...prev,
          wallets: prev.wallets.map((w) =>
            w.id === bill.walletId ? { ...w, balanceCentavos: w.balanceCentavos - bill.amountCentavos } : w
          ),
          buckets: prev.buckets.map((b) =>
            b.id === bill.bucketId ? { ...b, spentCentavos: b.spentCentavos + bill.amountCentavos } : b
          ),
          recurringBills: prev.recurringBills.map((b) =>
            b.id === billId ? { ...b, lastPaidDate: new Date().toISOString().slice(0, 10) } : b
          ),
          transactions: [newTx, ...prev.transactions],
        }));
        showToast(`Paid ${bill.name} (${formatPeso(bill.amountCentavos)})!`);
      };

      // Add a custom recurring bill or subscription
      const handleAddBill = (newBill) => {
        setState((prev) => ({
          ...prev,
          recurringBills: [...prev.recurringBills, { ...newBill, id: `bill-${Date.now()}` }],
        }));
        showToast(`Saved ${newBill.type === 'subscription' ? 'subscription' : 'bill'}: ${newBill.name}`);
      };

      // Add custom envelope
      const handleAddEnvelope = (newBucket) => {
        setState((prev) => ({
          ...prev,
          buckets: [...prev.buckets, { ...newBucket, id: `bucket-${Date.now()}`, spentCentavos: 0 }],
        }));
        showToast(`Created envelope: ${newBucket.name}`);
      };

      // Add custom wallet
      const handleAddWallet = (newWallet) => {
        setState((prev) => ({
          ...prev,
          wallets: [...prev.wallets, { ...newWallet, id: `wallet-${Date.now()}`, updatedAt: new Date().toISOString() }],
        }));
        showToast(`Created account: ${newWallet.name}`);
      };

      // Export JSON backup
      const handleExportJSON = () => {
        triggerAudio('click');
        const payload = { ...state, lastBackupDate: new Date().toISOString() };
        const blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `centavo-backup-${new Date().toISOString().split('T')[0]}.json`;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
        showToast('Backup JSON downloaded!');
      };

      // Export CSV ledger
      const handleExportCSV = () => {
        triggerAudio('click');
        exportToCSV(state.transactions, state.buckets, state.wallets);
        showToast('Spreadsheet CSV downloaded!');
      };

      // Import JSON backup
      const handleImportJSON = (file) => {
        const reader = new FileReader();
        reader.onload = (e) => {
          try {
            const parsed = JSON.parse(e.target.result);
            if (parsed && Array.isArray(parsed.wallets) && Array.isArray(parsed.buckets)) {
              setState({
                ...INITIAL_STATE,
                ...parsed,
                recurringBills: parsed.recurringBills || INITIAL_STATE.recurringBills,
                savingsGoals: parsed.savingsGoals || INITIAL_STATE.savingsGoals,
              });
              showToast('Backup restored successfully!');
            } else {
              showToast('Invalid backup file structure.', 'error');
            }
          } catch {
            showToast('Malformed JSON backup file.', 'error');
          }
        };
        reader.readAsText(file);
      };

      // Reset data
      const handleResetData = () => {
        triggerAudio('click');
        setState(INITIAL_STATE);
        showToast('Reset to default Philippine sample data.');
      };

      // Render helper for Privacy Blur
      const RenderAmount = ({ centavos, showSign = false, className = '', compact = false }) => {
        const text = formatPeso(centavos, { showSign, compact });
        return (
          <span className={`inline-block num-font transition-all duration-200 select-none ${state.isPrivacyMode ? 'filter blur-[5px] select-none pointer-events-none' : ''} ${className}`}>
            {text}
          </span>
        );
      };

      // Available Months for Filtering (extracted dynamically from transactions ledger)
      const availableMonths = useMemo(() => {
        const monthMap = new Map();
        const now = new Date();
        const currentKey = `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}`;
        const currentLabel = now.toLocaleDateString('en-US', { month: 'long', year: 'numeric' });
        monthMap.set(currentKey, currentLabel);

        (state.transactions || []).forEach((tx) => {
          if (tx.timestamp) {
            const key = tx.timestamp.slice(0, 7); // 'YYYY-MM'
            if (!monthMap.has(key)) {
              const d = new Date(tx.timestamp);
              if (!isNaN(d.getTime())) {
                monthMap.set(key, d.toLocaleDateString('en-US', { month: 'long', year: 'numeric' }));
              }
            }
          }
        });

        return Array.from(monthMap.entries())
          .map(([value, label]) => ({ value, label }))
          .sort((a, b) => b.value.localeCompare(a.value));
      }, [state.transactions]);

      // Filtered transactions by category, month & search query
      const filteredTransactions = useMemo(() => {
        const query = searchQuery.trim().toLowerCase();

        return (state.transactions || []).filter((tx) => {
          const matchesCategory =
            selectedCategoryFilter === 'all' || tx.bucketId === selectedCategoryFilter;

          let matchesMonth = true;
          if (selectedMonthFilter !== 'all') {
            matchesMonth = Boolean(tx.timestamp && tx.timestamp.startsWith(selectedMonthFilter));
          }

          let matchesSearch = true;
          if (query) {
            const bucketName = state.buckets.find((b) => b.id === tx.bucketId)?.name?.toLowerCase() || '';
            const walletName = state.wallets.find((w) => w.id === tx.walletId)?.name?.toLowerCase() || '';
            const noteText = (tx.note || '').toLowerCase();
            matchesSearch =
              noteText.includes(query) ||
              bucketName.includes(query) ||
              walletName.includes(query);
          }

          return matchesCategory && matchesMonth && matchesSearch;
        });
      }, [state.transactions, selectedCategoryFilter, selectedMonthFilter, searchQuery, state.buckets, state.wallets]);

      // Reset to page 1 on filter or search changes
      useEffect(() => {
        setCurrentTxPage(1);
      }, [selectedCategoryFilter, selectedMonthFilter, searchQuery]);

      // Paginated transactions (5 items per page)
      const totalTxPages = Math.max(1, Math.ceil(filteredTransactions.length / TX_PAGE_SIZE));

      useEffect(() => {
        if (currentTxPage > totalTxPages) {
          setCurrentTxPage(totalTxPages);
        }
      }, [currentTxPage, totalTxPages]);

      const paginatedTransactions = useMemo(() => {
        const start = (currentTxPage - 1) * TX_PAGE_SIZE;
        return filteredTransactions.slice(start, start + TX_PAGE_SIZE);
      }, [filteredTransactions, currentTxPage]);

      return (
        <div className="min-h-screen bg-[#F8F9F7] text-[#181C19] dark:bg-[#0F1412] dark:text-[#F1F5F3] flex flex-col font-sans transition-colors duration-250">

          {/* Animated Botanical Coin Splash Screen */}
          {showSplash && (
            <SplashScreen onFinish={() => setShowSplash(false)} theme={theme} />
          )}

          {/* Main Responsive Container: Phone (max-w-md), iPad (md:max-w-3xl), Desktop/Tablet (lg:max-w-4xl) */}
          <div className="max-w-md md:max-w-3xl lg:max-w-4xl w-full mx-auto min-h-screen bg-[#F8F9F7] dark:bg-[#0F1412] flex flex-col relative pb-28 border-x border-[#E7EAE5] dark:border-[#27342D]/80 shadow-xs transition-colors duration-250">

            {/* Header: Logo + Title + "Every Centavo Counts" + Sound, Theme, Privacy Controls */}
            <header className="sticky top-0 z-30 bg-[#F8F9F7]/95 dark:bg-[#0F1412]/95 backdrop-blur-md border-b border-[#E7EAE5] dark:border-[#27342D] px-4 md:px-8 py-3.5 transition-colors duration-250">
              <div className="flex items-center justify-between">
                {/* Brand */}
                <div className="flex items-center space-x-3">
                  {theme === 'pink' ? (
                    <HelloKittyAvatar className="w-10 h-10 flex-shrink-0 animate-in zoom-in duration-200" />
                  ) : (
                    <div className="w-10 h-10 rounded-xl bg-[#1F6E58] dark:bg-[#2ABF9E] flex items-center justify-center shadow-xs transition-colors">
                      <span className="text-white dark:text-[#0F1412] font-extrabold text-lg leading-none select-none">₱</span>
                    </div>
                  )}
                  <div>
                    <div className="flex items-center space-x-2">
                      <h1 className="font-bold text-[#181C19] dark:text-[#F1F5F3] text-base md:text-lg tracking-tight leading-none">
                        Centavo
                      </h1>
                      <span className="text-[10px] font-semibold tracking-wider uppercase px-2 py-0.5 rounded-full bg-[#E8F3EE] dark:bg-[#153228] text-[#1F6E58] dark:text-[#2ABF9E] flex items-center gap-1">
                        {theme === 'pink' && <IconHelloKittyBow className="w-3 h-3 inline" />}
                        <span>Offline</span>
                      </span>
                    </div>
                    <p className="text-[11px] md:text-xs text-[#647067] dark:text-[#8E9E94] font-medium leading-tight mt-0.5">
                      Every Centavo Counts
                    </p>
                  </div>
                </div>

                {/* Header Action Tools: Sound, Theme Switcher, Privacy Blur */}
                <div className="flex items-center space-x-2">
                  {/* Total Savings Pill Badge (iPad / Desktop view delight) */}
                  <div
                    onClick={() => { triggerAudio('click'); setActiveTab('envelopes'); }}
                    className="hidden sm:flex items-center space-x-1 px-3 py-1.5 rounded-xl border border-[#E7EAE5] dark:border-[#27342D] bg-white dark:bg-[#18201C] text-xs font-bold cursor-pointer active:scale-95 transition-all shadow-2xs"
                  >
                    <IconPiggyBank className="w-4 h-4 text-[#1F6E58] dark:text-[#2ABF9E]" />
                    <span className="text-[#647067] dark:text-[#8E9E94]">Saved:</span>
                    <span className="text-[#181C19] dark:text-[#F1F5F3]">{formatPeso(totalSavedCentavos, { compact: true })}</span>
                  </div>

                  {/* Sound Toggle */}
                  <button
                    onClick={toggleSound}
                    type="button"
                    aria-label="Toggle haptic audio"
                    className="w-10 h-10 flex items-center justify-center rounded-xl bg-white dark:bg-[#18201C] border border-[#E7EAE5] dark:border-[#27342D] text-[#647067] dark:text-[#8E9E94] hover:text-[#181C19] dark:hover:text-[#F1F5F3] active:scale-95 transition-all shadow-2xs"
                    title={soundEnabled ? 'Haptic sound enabled' : 'Haptic sound muted'}
                  >
                    {soundEnabled ? <IconVolume className="w-4 h-4 text-[#1F6E58] dark:text-[#2ABF9E]" /> : <IconVolumeMute className="w-4 h-4 text-stone-400" />}
                  </button>

                  {/* 3-Way Theme Switcher (Sage Light -> Obsidian Dark -> Baby Pink Hello Kitty) */}
                  <button
                    onClick={cycleTheme}
                    type="button"
                    aria-label="Cycle Theme Mode"
                    className="w-10 h-10 flex items-center justify-center rounded-xl bg-white dark:bg-[#18201C] border border-[#E7EAE5] dark:border-[#27342D] text-[#647067] dark:text-[#8E9E94] hover:text-[#181C19] dark:hover:text-[#F1F5F3] active:scale-95 transition-all shadow-2xs"
                    title={
                      theme === 'light'
                        ? 'Current: Sage Light (Tap for Dark)'
                        : theme === 'dark'
                          ? 'Current: Obsidian Dark (Tap for Baby Pink)'
                          : 'Current: Baby Pink & Pastel (Tap for Light)'
                    }
                  >
                    {theme === 'light' && <IconSun className="w-4 h-4 text-amber-500" />}
                    {theme === 'dark' && <IconMoon className="w-4 h-4 text-[#2ABF9E]" />}
                    {theme === 'pink' && <IconHelloKittyBow className="w-4 h-4" />}
                  </button>

                  {/* Privacy Eye Toggle */}
                  <button
                    onClick={togglePrivacyMode}
                    type="button"
                    aria-label="Toggle Privacy Blur"

    // --- Modal: Enhanced Quick Entry Drawer with Tactile Keypad (iPad Compatible) ---
    function QuickEntryDrawerModal({ wallets, buckets, onClose, onSubmit, triggerAudio, theme }) {
      const [buffer, setBuffer] = useState('0');
      const [bucketId, setBucketId] = useState(buckets[0]?.id || 'bucket-food');
      const [walletId, setWalletId] = useState(wallets[0]?.id || 'wallet-cash');
      const [note, setNote] = useState('');
      const [refNo, setRefNo] = useState('');
      const isPink = theme === 'pink';
      const [showGCashParser, setShowGCashParser] = useState(false);
      const [gcashPasteText, setGCashPasteText] = useState('');
      const [gcashParseError, setGCashParseError] = useState('');

      const parseGCashSMS = () => {
        const text = gcashPasteText;
        const amountMatch = text.match(/PHP\s*([\d,]+\.?\d*)/i);
        const amount = amountMatch ? parseFloat(amountMatch[1].replace(/,/g, '')) : null;
        if (!amount || amount <= 0) {
          setGCashParseError('Could not read amount. Make sure the message contains "PHP XXX.XX".');
          return;
        }
        const merchantMatch = text.match(/(?:paid|sent)\s+PHP[\d,.\s]+to\s+(.+?)(?:\.|Ref|on\s|\n|$)/i);
        const merchant = merchantMatch ? merchantMatch[1].trim() : '';
        const refMatch = text.match(/Ref(?:erence)?\.?\s*No\.?\s*[:\s]?\s*([A-Z0-9]+)/i);
        const parsedRef = refMatch ? refMatch[1] : '';
        const centavos = Math.round(amount * 100);
        setBuffer((centavos / 100).toFixed(centavos % 100 === 0 ? 0 : 2));
        setNote(merchant || 'GCash Transfer');
        if (parsedRef) setRefNo(parsedRef);
        setWalletId('wallet-gcash');
        setGCashParseError('');
        setShowGCashParser(false);
        setGCashPasteText('');
        triggerAudio('click');
      };

      const handleKey = (k) => {
        triggerAudio('click');
        if (k === 'C') {
          setBuffer('0');
          return;
        }
        if (k === '⌫') {
          setBuffer((prev) => {
            const trimmed = prev.trimEnd();
            if (trimmed.length <= 1) return '0';
            if (trimmed.endsWith('+') || trimmed.endsWith('-')) {
              const stripped = trimmed.slice(0, -1).trimEnd();
              return stripped.length > 0 ? stripped : '0';
            }
            return trimmed.slice(0, -1) || '0';
          });
          return;
        }
        if (k === '=') {
          const evaluated = evaluateMathExpression(buffer);
          setBuffer((evaluated / 100).toFixed(evaluated % 100 === 0 ? 0 : 2));
          return;
        }
        if (k === '+' || k === '-') {
          setBuffer((prev) => {
            const trimmed = prev.trim();
            if (trimmed.endsWith('+') || trimmed.endsWith('-')) {
              return trimmed.slice(0, -1).trim() + ' ' + k + ' ';
            }
            if (trimmed === '0') return prev;
            return trimmed + ' ' + k + ' ';
          });
          return;
        }
        if (k === '.') {
          setBuffer((prev) => {
            const lastPart = prev.split(/[+\-]/).pop().trim();
            if (lastPart.includes('.')) return prev;
            return prev + '.';
          });
          return;
        }
        setBuffer((prev) => {
          if (prev === '0') return k;
          const lastPart = prev.split(/[+\-]/).pop().trim();
          if (lastPart.includes('.')) {
            const parts = lastPart.split('.');
            if (parts[1] && parts[1].length >= 2) return prev;
          }
          if (prev.length >= 24) return prev;
          return prev + k;
        });
      };

      const handleAddPreset = (pesoAmount) => {
        triggerAudio('click');
        const currentCentavos = evaluateMathExpression(buffer);
        const addedCentavos = pesoAmount * 100;
        const newTotal = currentCentavos + addedCentavos;
        setBuffer((newTotal / 100).toFixed(newTotal % 100 === 0 ? 0 : 2));
      };

      const hasOperator = buffer.includes('+') || buffer.includes('-');
      const centavos = evaluateMathExpression(buffer);
      const selectedBucket = buckets.find((b) => b.id === bucketId);
      const remInBucket = selectedBucket ? selectedBucket.allocatedCentavos - selectedBucket.spentCentavos : 0;

      const handleSave = () => {
        if (centavos <= 0) return;
        onSubmit({
          amountCentavos: centavos,
          bucketId,
          walletId,
          note: note.trim() || 'Quick Expense',
          refNo: refNo.trim(),
        });
        onClose();
      };

      const CHIPS = [
        { id: 'bucket-food', label: 'Food', icon: IconUtensils },
        { id: 'bucket-transport', label: 'Transport', icon: IconCar },
        { id: 'bucket-bills', label: 'Bills', icon: IconReceipt },
        { id: 'bucket-wants', label: 'Wants', icon: IconSparkles },
      ];

      return (
        <div className="fixed inset-0 z-50 flex items-end sm:items-center justify-center bg-black/60 backdrop-blur-xs transition-opacity animate-in fade-in duration-150 p-0 sm:p-4">
          <div className="fixed inset-0" onClick={onClose} />

          <div className="relative w-full max-w-md sm:max-w-lg bg-white dark:bg-[#18201C] rounded-t-3xl sm:rounded-3xl shadow-2xl border-t sm:border border-[#E7EAE5] dark:border-[#27342D] pb-6 pt-3 px-5 z-10 animate-in slide-in-from-bottom duration-200">
            {/* Grab pill */}
            <div className="w-12 h-1.5 bg-[#E7EAE5] dark:bg-[#27342D] rounded-full mx-auto mb-3 sm:hidden" />

            {/* Header: Title + Remaining Badge + Close button */}
            <div className="flex items-center justify-between mb-3 px-1">
              <div className="flex items-center space-x-2">
                <span className="text-xs font-bold uppercase tracking-wider text-[#1F6E58] dark:text-[#2ABF9E] flex items-center gap-1">
                  <span>Quick Log</span>
                  {isPink && <IconHelloKittyBow className="w-3.5 h-3.5 inline" />}
                </span>
                {selectedBucket && (
                  <span className="text-[11px] font-semibold px-2 py-0.5 rounded-full bg-[#E8F3EE] dark:bg-[#153228] text-[#1F6E58] dark:text-[#2ABF9E]">
                    {formatPeso(remInBucket)} left in {selectedBucket.name.split(' ')[0]}
                  </span>
                )}
              </div>
              <button
                onClick={onClose}
                type="button"
                className="w-8 h-8 flex items-center justify-center rounded-full text-[#647067] dark:text-[#8E9E94] hover:bg-stone-100 dark:hover:bg-stone-800 active:scale-90 transition-all font-bold"

            </div>

            {/* Enhanced Amount Display Screen with Inline Math Support */}

              <div className="flex items-center justify-between text-[10px] text-[#647067] dark:text-[#8E9E94] font-bold uppercase tracking-wider mb-1">
                <span>Amount in Philippine Peso</span>
                {hasOperator && (
                  <span className="text-[#1F6E58] dark:text-[#2ABF9E] font-extrabold animate-pulse">
                    Quick Math (+ / -)
                  </span>
                )}
              </div>
              <div className="text-3xl sm:text-4xl font-extrabold num-font tracking-tight flex items-center justify-center space-x-1 min-h-[44px] overflow-x-auto px-2">
                <span className="text-[#1F6E58] dark:text-[#2ABF9E] font-bold text-2xl">₱</span>
                <span className={centavos > 0 ? 'text-[#181C19] dark:text-[#F1F5F3]' : 'text-[#647067]/70 dark:text-[#8E9E94]/60'}>
                  {buffer}
                </span>
              </div>
              {hasOperator && (
                <div className="mt-1 text-xs font-bold text-[#1F6E58] dark:text-[#2ABF9E] bg-[#E8F3EE] dark:bg-[#153228] py-0.5 px-2.5 rounded-full inline-block shadow-2xs">
                  = {formatPeso(centavos)}
                </div>
              )}
            </div>

            {/* Quick-Add Preset Chips */}
            <div className="flex items-center justify-between gap-1.5 mb-3">

                {wallets.slice(0, 2).map((w) => {

                    <button
                      key={w.id}
                      type="button"
                      onClick={() => { triggerAudio('click'); setWalletId(w.id); }}
                      className={`h-10 flex items-center justify-between px-3 rounded-xl border text-xs font-semibold active:scale-95 transition-all shadow-2xs ${sel
                        ? 'bg-[#E8F3EE] dark:bg-[#153228] border-[#1F6E58] dark:border-[#2ABF9E] text-[#1F6E58] dark:text-[#2ABF9E]'
                        : 'bg-white dark:bg-[#141C18] border-[#E7EAE5] dark:border-[#27342D] text-[#647067] dark:text-[#8E9E94]'
                        }`}
                    >
                      <span className="truncate">{w.name}</span>
                      <span className="text-[10px] font-mono font-bold">{formatPeso(w.balanceCentavos, { compact: true })}</span>
                    </button>
                  );
                })}
              </div>
            </div>

            {/* Short Note & Optional Ref No */}
            <div className="mb-3 space-y-1.5">
              <input
                type="text"

                placeholder="Merchant or note (e.g., Jollibee, Grab, Load)"
                className="w-full h-10 px-3 rounded-xl bg-[#F8F9F7] dark:bg-[#141C18] border border-[#E7EAE5] dark:border-[#27342D] text-xs text-[#181C19] dark:text-[#F1F5F3] placeholder:text-[#647067]/60 dark:placeholder:text-[#8E9E94]/60 focus:outline-hidden focus:border-[#1F6E58] dark:focus:border-[#2ABF9E]"
              />
              {(walletId === 'wallet-gcash' || refNo) && (
                <div className="flex items-center space-x-2">
                  <span className="text-[10px] font-bold text-[#1F6E58] dark:text-[#2ABF9E] bg-[#E8F3EE] dark:bg-[#153228] px-2 py-1 rounded-lg border border-[#1F6E58]/30 dark:border-[#2ABF9E]/30 flex-shrink-0">
                    Ref #
                  </span>
                  <input
                    type="text"
                    value={refNo}
                    onChange={(e) => setRefNo(e.target.value)}
                    placeholder="GCash Ref. No. (optional)"
                    className="flex-1 h-8 px-2.5 rounded-lg bg-[#F8F9F7] dark:bg-[#141C18] border border-[#E7EAE5] dark:border-[#27342D] text-xs text-[#181C19] dark:text-[#F1F5F3] placeholder:text-[#647067]/50 font-mono focus:outline-hidden focus:border-[#1F6E58] dark:focus:border-[#2ABF9E]"
                  />
                </div>
              )}

            {/* Enhanced Tactile Numeric Keypad with Quick Math (+ / - / = / C) */}

                { k: '7', type: 'num' },
                { k: '8', type: 'num' },
                { k: '9', type: 'num' },
                { k: '⌫', type: 'back' },

                { k: '4', type: 'num' },
                { k: '5', type: 'num' },
                { k: '6', type: 'num' },
                { k: '+', type: 'op' },

                { k: '1', type: 'num' },
                { k: '2', type: 'num' },
                { k: '3', type: 'num' },
                { k: '-', type: 'op' },

                { k: 'C', type: 'clear' },
                { k: '0', type: 'num' },
                { k: '.', type: 'num' },
                { k: '=', type: 'eq' },
              ].map(({ k, type }) => {
                let btnClasses = 'bg-white dark:bg-[#1D2722] text-[#181C19] dark:text-[#F1F5F3] border border-[#E2E6E0] dark:border-[#2C3B33] hover:bg-stone-50 dark:hover:bg-[#25322B]';
                if (type === 'back') {
                  btnClasses = 'bg-red-50 dark:bg-red-950/40 text-[#DC2626] dark:text-red-300 border border-red-200 dark:border-red-900/60 hover:bg-red-100 dark:hover:bg-red-950/70';
                } else if (type === 'clear') {
                  btnClasses = 'bg-stone-100 dark:bg-[#16201B] text-[#647067] dark:text-[#8E9E94] border border-[#E2E6E0] dark:border-[#27342D] hover:bg-stone-200 dark:hover:bg-[#1E2B24] font-bold';
                } else if (type === 'op') {
                  btnClasses = 'bg-[#E8F3EE] dark:bg-[#153228] text-[#1F6E58] dark:text-[#2ABF9E] border border-[#1F6E58]/30 dark:border-[#2ABF9E]/30 font-extrabold hover:bg-[#D8EDE4] dark:hover:bg-[#1E4336]';
                } else if (type === 'eq') {
                  btnClasses = 'bg-[#1F6E58] dark:bg-[#2ABF9E] text-white dark:text-[#0F1412] border border-[#144F3F] dark:border-[#2ABF9E] font-black hover:opacity-95 shadow-xs';

                      </svg>

                      k

            {/* Save Button */}
            <button
